<title>Source Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a premium sourcing catalog — warm paper ground, white cards with soft shadows, serif headings, one emerald accent; detail and forms open as sheets */
:root{
  --bg:#f6f3ee; --surface:#ffffff; --sunk:#eee9e1; --line:#e4ddd2;
  --fg:#141414; --muted:#6b665d; --accent:#0f6b52; --accent-fg:#ffffff; --accent-soft:#e2efe9;
  --stamp:#a8321e; --ok:#1d7a45; --warn:#9a6400;
  --shadow:0 1px 2px rgb(40 30 15 / .05),0 4px 14px rgb(40 30 15 / .06);
  --shadow-hi:0 2px 4px rgb(40 30 15 / .06),0 10px 26px rgb(40 30 15 / .10);
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151411; --surface:#1e1d19; --sunk:#282621; --line:#35322b;
  --fg:#efebe3; --muted:#a59f93; --accent:#5fc6a0; --accent-fg:#0b1a14; --accent-soft:#1b3029;
  --stamp:#ec8b74; --ok:#7dd59e; --warn:#e3b341;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 4px 14px rgb(0 0 0 / .25);
  --shadow-hi:0 2px 4px rgb(0 0 0 / .35),0 10px 26px rgb(0 0 0 / .35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151411; --surface:#1e1d19; --sunk:#282621; --line:#35322b;
  --fg:#efebe3; --muted:#a59f93; --accent:#5fc6a0; --accent-fg:#0b1a14; --accent-soft:#1b3029;
  --stamp:#ec8b74; --ok:#7dd59e; --warn:#e3b341;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 4px 14px rgb(0 0 0 / .25);
  --shadow-hi:0 2px 4px rgb(0 0 0 / .35),0 10px 26px rgb(0 0 0 / .35); color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:14px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:2.1rem;letter-spacing:-.015em;margin:0;line-height:1}
h1 span{color:var(--accent);font-style:italic;font-weight:500}
.count{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
@media (max-width:700px){
  header.top{position:static}
  h1{font-size:1.6rem}
  .top .wrap{gap:8px;padding-block:10px 8px}
  header.top #cats{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  #cats select.chip{flex:none;max-width:60vw}
  .searchrow .seg{width:100%;overflow-x:auto}
  .searchrow .seg button{flex:1 0 auto;white-space:nowrap;padding:8px 10px}
  .brand .btn.sm{padding:5px 9px;font-size:.8rem}
}
.cam{position:fixed;inset:0;z-index:31;background:#000;color:#fff;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam .cframe{position:absolute;left:50%;top:44%;width:min(86vw,560px);aspect-ratio:1.75;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.75);border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,0,0,.35);transition:border-color .15s;pointer-events:none}
.cam .cframe.good{border-color:#40c057}.cam .cframe.bad{border-color:#fab005}
.cam .chead{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(#000a,#0000)}
.cam .chead .x{color:#fff;margin-left:auto}
.cam .cmsg{position:absolute;left:0;right:0;top:calc(44% + min(43vw,280px)/1.75 + 18px);text-align:center;font-weight:600;font-size:1.05rem;text-shadow:0 1px 3px #000}
.cam .cbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(#0000,#000c)}
.cam .cbar .btn{min-width:110px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.6)}
.cam .shot{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}
.cam .thumbs{display:flex;gap:6px}.cam .thumbs img{height:44px;border-radius:6px;border:2px solid #fff}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.cam .flash.on{opacity:.8;transition:none}
.cam .meter{height:4px;width:min(60vw,240px);background:#fff3;border-radius:2px;overflow:hidden;margin:8px auto 0}.cam .meter i{display:block;height:100%;width:0;background:#40c057;transition:width .1s}
.xtab{overflow:auto;padding:0 8px 24px}.xt{border-collapse:collapse;font-size:.82rem;background:var(--surface)}.xt td,.xt th{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;text-align:left;vertical-align:top}.xt th{background:var(--bg);position:sticky;top:0}.ximg{height:72px;max-width:110px;object-fit:contain;display:block;background:#fff;border-radius:4px}
.viewer{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vhead{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.vtitle{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--sunk)}
.vbody canvas,.vbody .vimg{background:#fff;box-shadow:var(--shadow);max-width:100%;display:block}
.vbody .status,.vbody .note{padding:12px}

/* ---------- wide screens: list on the left, detail pane on the right ---------- */
@media (min-width:980px){
  :root{--lw:clamp(380px,34vw,480px)}
  header.top,main{width:var(--lw);border-right:1px solid var(--line)}
  main{min-height:100vh}
  header.top .wrap,main .wrap{max-width:none;padding-left:16px;padding-right:16px}
  h1{font-size:1.7rem}
  header.top #cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  #cats select.chip{flex:none}
  .searchrow .seg{width:100%;overflow-x:auto}
  .searchrow .seg button{flex:1 0 auto;white-space:nowrap;padding:8px 9px;font-size:.82rem}
  #add.fab{right:auto;left:calc(var(--lw) - 196px);width:auto}
  #sheetRoot{position:fixed;top:0;bottom:0;right:0;left:var(--lw);z-index:4;background:var(--bg)}
  #sheetRoot:empty{display:grid;place-items:center}
  #sheetRoot:empty::after{content:"Select a factory on the left to see its contact, quotes and files.";color:var(--muted);font-size:1rem;max-width:320px;text-align:center}
  #sheetRoot .scrim{position:absolute;inset:0;background:transparent;display:block;z-index:auto}
  #sheetRoot .sheet{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;animation:none;padding-left:32px;padding-right:32px}
  .slip.on{box-shadow:0 0 0 2px var(--accent)}
}
.searchrow{display:flex;gap:8px;flex-wrap:wrap}
.searchrow .seg{flex:1 1 auto}
.searchrow .seg button{flex:1}
.scard select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-size:.85rem}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#cats{flex-wrap:wrap;overflow:visible}
#cats .chip.sub{font-size:.85em;border-style:dashed;opacity:.92}
#cats .chip.sub[aria-pressed="true"]{border-style:solid;opacity:1}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .n{font-family:var(--mono);font-size:.74rem;opacity:.7;margin-left:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:8px 12px;cursor:pointer;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--stamp);border-color:var(--stamp);background:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:.85rem}

main .wrap{padding-block:16px 120px;display:grid;gap:10px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-weight:600;font-size:1.4rem}

.slip{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.slip:hover{border-color:var(--accent)}
.thumb{width:64px;aspect-ratio:1.75;max-width:100%;border-radius:4px;background:var(--sunk);object-fit:cover;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--muted);font-size:1rem;overflow:hidden}
.slip .body{min-width:0;display:grid;gap:3px}
.slip .name{font-weight:600;font-size:1rem;overflow-wrap:anywhere}

.slip .meta{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:.76rem;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-weight:500}
.src{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;color:var(--muted)}
.src-WeChat{color:#1a9b4b}
.src-Alibaba{color:#e8590c} .src-GlobalSources{color:#c2255c}
.src-Email{color:#1c7ed6} .src-Cardscan{color:#7048e8}
.qbadge{font-family:var(--mono);font-size:.74rem;color:var(--muted)}

.qrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.qrow .item{font-weight:600;min-width:0;overflow-wrap:anywhere}
.qrow .price{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.qrow .sub{color:var(--muted);font-size:.84rem;min-width:0;overflow-wrap:anywhere}
.qrow .terms{font-family:var(--mono);font-size:.76rem;color:var(--muted);text-align:right;white-space:nowrap}
.qrow.best .price{color:var(--ok)}
.qrow.hasimg{grid-template-columns:64px 1fr auto}
.qrow.hasimg .pimg{grid-row:span 2}
.pimg{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line);display:block}
.qtable td.pcell{width:72px;padding-right:10px}
.qtable .pimg{width:64px;height:64px}
a.plink{display:block;line-height:0}
.dlist{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow)}
.drow .dic{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--stamp);border:1px solid currentColor;border-radius:4px;padding:2px 5px}
.drow .dmain{min-width:0}
.drow .dmain a{color:var(--fg);font-weight:500;text-decoration:none;overflow-wrap:anywhere}
.drow .dmain a:hover{color:var(--accent);text-decoration:underline}
.drow .dconf{grid-column:1/-1}
.drow .dconf:empty{display:none}
@media (max-width:560px){.drow{grid-template-columns:auto 1fr}.drow>.row{grid-column:1/-1;justify-content:flex-end}}
.dtags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:3px 0 1px}
.dtags .tag{font-size:.7rem;padding:2px 8px}
.dsub{font-size:.78rem;font-weight:600;color:var(--muted);margin:6px 0 2px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:.78rem;cursor:pointer;padding:0 2px;text-decoration:underline}
.qhead .pimg{width:40px;height:40px;display:inline-block;vertical-align:middle;margin-right:8px}
.qhead{font-family:var(--display);font-weight:600;font-size:1.2rem;letter-spacing:-.005em;margin:14px 0 2px;color:var(--fg)}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;box-shadow:0 6px 20px rgb(0 0 0 / .22);padding:13px 18px;border-radius:999px;font-weight:600}

/* sheets */
.scrim{position:fixed;inset:0;background:rgb(10 15 25 / .45);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;border-radius:16px 16px 0 0;padding-block:0 calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:90%}}
.sheethead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:14px}
.sheethead h2{font-family:var(--display);font-weight:600;font-size:1.55rem;margin:0;letter-spacing:-.01em;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:none}
.stack{display:grid;gap:14px}
.sec{display:grid;gap:8px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:var(--r);aspect-ratio:1.75;max-width:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.85rem;cursor:pointer;overflow:hidden;background:var(--surface)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:.88rem;color:var(--muted);min-height:1.2em}
.status.err{color:var(--stamp)}
.status.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;padding:0 0 0 6px;font-size:.8rem}
.bcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.bc{margin:0;display:grid;gap:6px;align-content:start}
.bc img{width:100%;aspect-ratio:1.6;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.bc figcaption{font-size:.78rem;color:var(--muted)}
.cardimgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.cardimgs img{width:100%;border-radius:6px;border:1px solid var(--line)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.85rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.line .f-item{grid-column:span 2}
.line .rm{justify-self:end}
@media (max-width:560px){.line{grid-template-columns:1fr 1fr}.line .f-item{grid-column:1/-1}.line .rm{grid-column:1/-1}}
.line input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
.line label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rm{border:0;background:none;color:var(--stamp);cursor:pointer;font-size:.85rem;padding:6px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.qcard .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.qtable{width:100%;border-collapse:collapse;font-size:.9rem}
.qtable td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.qtable td.num{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.tag.proj{background:transparent;border:1px solid var(--accent);text-transform:none;letter-spacing:0}
.stars{color:var(--accent);font-size:.82rem;letter-spacing:1px}
.flag{font-size:.8rem;color:var(--muted)}
.flag.soon{color:var(--accent);font-weight:600}
.flag.exp{color:var(--stamp);font-weight:600}
.followbox{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.followbox.exp{border-color:var(--stamp)}
.followbox.soon{border-color:var(--accent)}
.rating{display:flex;gap:2px;align-items:center}
.rating [role=radio]{border:0;background:none;font-size:1.5rem;color:var(--accent);cursor:pointer;padding:0 2px;line-height:1}
.mrow{display:grid;grid-template-columns:84px 84px 1fr;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.mrow img{width:84px;height:54px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid var(--line)}
.mrow .nob{width:84px;height:54px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:4px;color:var(--muted);font-size:.75rem}
.mrow .chk{color:var(--warn,#b45309);font-weight:600}

<script>
(() => {
const DEFAULT_CATS = ["Barware","Sporting Goods","Tie-Down Straps","Water Filters","Housewares","Packaging"];
const S = { sup:new Map(), quotes:[], samples:[], finds:[], docs:[], dcat:false, dgroup:(()=>{ try{ const v=localStorage.getItem("sb-dgroup"); return v==="other"?"other":"quote"; }catch{ return "quote"; } })(), dtype:"All", src:"All", met:"All", view:(()=>{ try{ return localStorage.getItem("sb-view")==="f"?"f":"h"; }catch{ return "h"; } })(), cat:"All", proj:"All", q:"", sort:(()=>{ try{ return localStorage.getItem("fb-sort")||"month"; }catch{ return "month"; } })(), loaded:{s:false,q:false} };
const STATUSES=["Requested","Shipped","Received","Approved","Rejected"];
let db=null, assets=null, sample=null, downloads=null, mcp=null, userNS=null, me=null, imgOK=false, canWrite=true;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr = v => Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);
const today = () => new Date().toISOString().slice(0,10);
const isExt = id => /^(https?:\/\/|blob:)/i.test(String(id||""));
const blobUrl = id => !id ? "" : isExt(id) ? id : "_blob/" + String(id).replace(/^\/?_blob\//,"");

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; $("#toastRoot").append(t); setTimeout(()=>t.remove(),2600); }

/* ---------- images: shrink phone photos before sending ---------- */
async function shrink(file, max=1600){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.85));
  }catch{ return file; }
}

/* ---------- data helpers ---------- */
const famOf=c=>String(c||"").split(" – ")[0];
const inCat=(c,sel)=>c===sel||famOf(c)===sel;
function allCats(){
  const set = new Set(DEFAULT_CATS);
  for (const s of S.sup.values()) arr(s.categories).forEach(c=>set.add(c));
  return [...set].sort((x,y)=>x.localeCompare(y));
}
function quotesFor(id){ return S.quotes.filter(q=>q.supplierId===id).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")) || (b.createdAt||0)-(a.createdAt||0)); }
function money(p,cur){ if(p===""||p==null||isNaN(+p)) return "—"; const n=+p; return (cur==="RMB"?"¥":cur==="EUR"?"€":"$")+n.toFixed(n<10?3:2).replace(/0$/,""); }

/* ---------- landed cost ---------- */
const SET_DEFAULT={signName:"Mike Mizrahi",signCompany:"Premier Accessory Group",rmbPerUsd:"7.1",usdPerEur:"1.08",freightPerUnit:"",containerCost:"9800",defaultUnits:"10000",dutyPct:"3",tariffPct:"37.5",otherPerUnit:"",targetMargin:"",customerPct:"55",marginPct:"40",minMarginPct:"35",customers:"Ross / Burlington = 52\nWalmart = 53\nDollar Tree / Family Dollar = 45"};
S.settings={...SET_DEFAULT};
const num=v=>{ if(v===""||v==null) return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:null; };
const pick=(a,b)=>num(a)!=null?num(a):num(b);
function toUsd(p,cur){ const n=num(p); if(n==null) return null;
  if(cur==="RMB"){ const r=num(S.settings.rmbPerUsd); return r?n/r:null; }
  if(cur==="EUR"){ const r=num(S.settings.usdPerEur); return r?n*r:null; }
  return n; }
function landed(q,l){
  const fob=toUsd(l.price,q.currency); if(fob==null) return null;
  const L=q.landed||{}, t=num(l.target);
  const mg=total=>t?(t-total)/t:null;
  if(q.incoterm==="DDP") return {fob,freight:0,duty:0,other:0,total:fob,pct:0,margin:mg(fob)};
  let freight=0;
  if(!["CIF","CFR"].includes(q.incoterm)){
    const cc=pick(L.containerCost,S.settings.containerCost), u=(n=>n&&n>=200?n:null)(num(l.unitsPerCtr))||num(S.settings.defaultUnits);
    freight=(cc!=null&&u)?cc/u:(pick(L.freightPerUnit,S.settings.freightPerUnit)??0);
  }
  const own=num(L.dutyPct)!=null||num(L.tariffPct)!=null;
  const td=own?null:typeDuty((x=>x&&!x.a?x.t:null)(typeOf(l)));
  const pct=td?num(td.pct):(pick(L.dutyPct,S.settings.dutyPct)??0)+(pick(L.tariffPct,S.settings.tariffPct)??0);
  const duty=fob*pct/100;

  const val={name:s=>String(s.company||s.companyChinese||"").toLowerCase(),cat:s=>String(arr(s.categories)[0]||"~").toLowerCase(),src:s=>srcOf(s).join(","),contact:s=>hasContact(s).length,
    quotes:s=>stats.get(s.id)?.n||0,fit:s=>{ const b=stats.get(s.id)?.best; return b?b.margin:-9; },added:s=>addedAt(s)||0};
  const rows=[...shown].sort((a,b)=>{ const x=val[K.k](a), y=val[K.k](b); return (x<y?-1:x>y?1:0)*K.dir || String(a.company||"").localeCompare(String(b.company||"")); });
  const th=(k,label,cls="")=>`<th class="${cls}" ${K.k===k?`aria-sort="${K.dir>0?"ascending":"descending"}"`:""}><button data-tsort="${k}" ${K.k===k?'aria-sort="1"':""}>${label}${K.k===k?(K.dir>0?" ↑":" ↓"):""}</button></th>`;
  L.innerHTML=`<div class="ftab"><table><thead><tr><th class="hm" aria-label="Picture"></th>${th("name","Factory")}${th("cat","Category","hm")}${th("src","Source","hm hw")}${th("contact","Contact","hc")}${th("quotes","Quotes","num")}${th("fit","Best fit")}${th("added","Added","hm num")}</tr></thead><tbody>${rows.map(s=>{
      const st=stats.get(s.id), c=hasContact(s), cats=arr(s.categories);
      const pic=s.cardFront||arr(s.cards)[0]?.file?blobUrl(s.cardFront||arr(s.cards)[0].file):(quotesFor(s.id).flatMap(q=>arr(q.lines)).find(l=>l.img)?.img||(()=>{ const sp=samplesFor(s.id).flatMap(x=>arr(x.photos))[0]; return sp?blobUrl(sp):""; })());
      return `<tr data-open="${esc(s.id)}" tabindex="0"><td class="hm">${pic?`<img class="ti" src="${esc(pic)}" alt="" loading="lazy">`:`<div class="ti"></div>`}</td>
        <td><div class="tn">${esc(s.company||s.companyChinese||"Unnamed factory")}</div>${s.company&&s.companyChinese?`<div class="tcn">${esc(s.companyChinese)}</div>`:s.products?`<div class="tcn">${esc(s.products)}</div>`:""}${c.length?"":`<span class="miss mo">No contact info</span>`}</td>
        <td class="hm"><span class="tsm">${esc(cats[0]||"—")}${cats.length>1?` +${cats.length-1}`:""}</span></td>
        <td class="hm hw"><span class="tsm">${esc(srcOf(s).join(", "))}</span></td>
        <td class="hc">${c.length?`<span class="tsm" title="${esc(c.join(", "))}">${esc(c.join(" · "))}</span>`:`<span class="miss">Missing</span>`}</td>
        <td class="num">${st?.n||""}</td>
        <td>${st?.best?fitBadge(st.best):""}</td>
        <td class="hm num"><span class="tsm">${addedAt(s)?esc(new Date(addedAt(s)).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"})):""}</span></td></tr>`; }).join("")}</tbody></table></div>`;
}
function renderQuotes(L,shown){
  const ids=new Set(shown.map(s=>s.id)), term=S.q.toLowerCase();
  const all=[]; let hidden=0;
  for(const q of S.quotes){ if(!ids.has(q.supplierId)) continue; const s=S.sup.get(q.supplierId);
    for(const l of arr(q.lines)){ if(!l||!(l.item||l.price)) continue;
      const ty=typeOf(l);
      if(ty?.a&&!S.addons){ hidden++; continue; }
      const t=ty?(ty.a?ADDON_GROUP:ty.t):UNSORTED;
      if(term){ const hay=[l.item,l.sku,t,s?.company,s?.companyChinese,s?.products].join(" ").toLowerCase(); if(!term.split(/\s+/).every(w=>hay.includes(w))) continue; }
      const f=fitFor(q,l,ty&&!ty.a?ty.t:null);
      if(S.qfit!=="All"){ const st=!f||f.retail==null?"none":f.st; if(st!==S.qfit) continue; }
      all.push({q,l,s,t,f}); } }
  S.qtypeCounts=new Map(); all.forEach(r=>S.qtypeCounts.set(r.t,(S.qtypeCounts.get(r.t)||0)+1));
  { const sel=document.querySelector("#qtypesel"); if(sel) sel.innerHTML=`<option value="All">All product types (${all.length})</option>`+[...S.qtypeCounts].sort((a,b)=>a[0].localeCompare(b[0])).map(([t,n])=>`<option value="${esc(t)}" ${t===S.qtype?"selected":""}>${esc(t)} (${n})</option>`).join("")+(S.qtype!=="All"&&!S.qtypeCounts.has(S.qtype)?`<option value="${esc(S.qtype)}" selected>${esc(S.qtype)} (0)</option>`:""); }
  const rows=S.qtype==="All"?all:all.filter(r=>r.t===S.qtype);
  const pending=untaggedItems().length;
  const top=[
    !costsSet()?`<div class="banner"><span>Landed cost is the factory price only. Add freight, duty and tariff in Settings so the fit check uses your real cost.</span>${canWrite?`<button class="btn sm" data-act="settings">Open Settings</button>`:""}</div>`:"",
    pending&&canWrite?`<div class="banner"><span>${S.tagging?esc(S.tagging):`${pending} item${pending>1?"s aren't":" isn't"} sorted into a product type yet.`}</span>${sample&&!S.tagging?`<button class="btn sm" data-act="tag">Sort with Claude</button>`:""}</div>`:"",
    sample?`<div class="banner"><span>Saw something in a store? Take a photo and find the closest items you've been quoted.</span><button class="btn sm" data-act="findsim">📷 Find similar</button></div>`:"",
    `<div class="note">${activeCust()?`<b>${esc(activeCust().name)}</b> (${activeCust().margin}% margin): `:""}Target retail × ${custPct()}% = customer cost. A quote fits when landed cost leaves ${setPct("marginPct",45)}% margin on that (${setPct("minMarginPct",33)}% minimum).${hidden?` ${hidden} add-on line${hidden>1?"s":""} hidden.`:""}</div>`].join("");
  if(!rows.length){ L.innerHTML=top+`<div class="empty"><strong>No quotes ${S.quotes.length?"match":"yet"}</strong><span>${S.quotes.length?"Try another search, type or fit filter.":"Open a factory and tap “Add quote”. You can type the prices or attach the quote sheet."}</span></div>`; return; }
  const groups=new Map(); rows.forEach(r=>{ if(!groups.has(r.t)) groups.set(r.t,[]); groups.get(r.t).push(r); });
  const last=t=>t===UNSORTED?2:t===ADDON_GROUP?1:0;
  const order=[...groups].sort((a,b)=>last(a[0])-last(b[0]) || (S.qsort==="az"?a[0].localeCompare(b[0]):(b[1].length-a[1].length)||a[0].localeCompare(b[0])));
  const lim=S.qtype==="All"?5:1e9;
  L.innerHTML=top+order.map(([t,g])=>{
    g.sort((a,b)=>(a.f?.lc?.total??1e9)-(b.f?.lc?.total??1e9));
    const nf=new Set(g.map(r=>r.q.supplierId)).size, real=t!==UNSORTED&&t!==ADDON_GROUP, tm=real?typeMath(t):null;
    const fits=g.filter(r=>r.f?.st==="ok").length, open=S.openGroups.has(t), show=open?g:g.slice(0,lim);
    return `<section class="tgroup"><div class="thead"><h3>${esc(t)}</h3><span class="tmeta">${g.length} quote${g.length>1?"s":""} · ${nf} factor${nf>1?"ies":"y"}${tm&&fits?` · ${fits} fit`:""}</span></div>
      ${real?`<div class="tcalc"><label>Target retail $<input data-retail="1" data-type="${esc(t)}" value="${esc(S.targets[tslug(t)]?.retail||"")}" inputmode="decimal" placeholder="e.g. 14.99" ${canWrite?"":"disabled"} aria-label="Target retail for ${esc(t)}"></label><label title="${esc(dutyTitle(typeDuty(t)))}">Duty + tariff %<input data-duty="1" data-type="${esc(t)}" value="${esc(typeDuty(t)?.pct??"")}" inputmode="decimal" placeholder="${esc(String((num(S.settings.dutyPct)??0)+(num(S.settings.tariffPct)??0)))}" ${canWrite?"":"disabled"} aria-label="Duty and tariff percent for ${esc(t)}" style="width:64px"></label>${typeDuty(t)?.hts?`<span class="note" title="${esc(dutyTitle(typeDuty(t)))}">HTS ${htsA(esc(typeDuty(t).hts))}</span>`:""}${tm?`<span>Customer cost <b>${usd(tm.cc)}</b></span><span>Max landed <b>${usd(tm.maxL)}</b></span><span>Max FOB ≈ <b>${tm.maxFob>0?usd(tm.maxFob):"—"}</b></span>`:`<span>Set a target retail to check which quotes fit.</span>`}</div>`:""}
      ${show.map((r,i)=>`<div class="qrow2${i===0&&r.f?.st==="ok"&&g.length>1?" best":""}" data-open="${esc(r.q.supplierId)}" tabindex="0" role="button">
        ${r.l.img?`<img class="pimg" src="${esc(r.l.img)}" alt="" loading="lazy">`:`<div class="ph"></div>`}
        <div class="who">${esc(r.s?.company||r.s?.companyChinese||"Unknown factory")}</div>
        <div class="nums"><span title="${r.f?.lc?esc("Landed: "+lcTitle(r.f.lc)):"Factory price"}">${r.f?.lc?usd(r.f.lc.total):money(r.l.price,r.q.currency)}</span>${real?fitBadge(r.f):""}</div>
        <div class="what">${esc(r.l.item||"Item")}</div>
        <div class="meta2">${esc([`${money(r.l.price,r.q.currency)} ${r.q.incoterm||""}`.trim(), r.l.moq?`MOQ ${r.l.moq}`:"", r.q.date].filter(Boolean).join(" · "))}${(()=>{ const o=originalsFor(r.q)[0]; return o?` <a class="linkbtn retype" href="${blobUrl(o.file)}" data-name="${esc(o.name)}">Original</a>`:""; })()}${canWrite&&r.l.item?` <button class="linkbtn retype" data-retype="${esc(r.l.item)}">Change type</button>`:""}</div>
      </div>`).join("")}
      ${g.length>show.length?`<button class="btn sm ghost more" data-more="${esc(t)}">Show all ${g.length}</button>`:""}</section>`;
  }).join("");
}

function srcOf(s){ if(Array.isArray(s.sources)&&s.sources.length) return s.sources; const v=String(s.source||"").toLowerCase(); if(v.includes("alibaba")) return ["Alibaba"]; if(v.includes("globalsources")) return ["Global Sources"]; if(v.includes("wechat")) return ["WeChat"]; if(v.includes("email")) return ["Email"]; if(v.includes("card")) return ["Card scan"]; if(!v && (s.cardFront||s.cardBack||arr(s.cards).length)) return ["Card scan"]; return ["Added by hand"]; }
function srcBadges(s){ return srcOf(s).map(x=>`<span class="src src-${esc(x.replace(/\W/g,""))}">${esc(x)}</span>`).join(""); }
function matches(s){
  if (S.src!=="All" && !srcOf(s).includes(S.src)) return false;
  if (S.cat!=="All" && !arr(s.categories).some(c=>inCat(c,S.cat))) return false;
  if (S.proj!=="All" && !arr(s.projects).includes(S.proj)) return false;
  if (S.met!=="All" && s.metAt!==S.met) return false;
  if (!S.q) return true;
  const hay = [s.metAt,s.booth,...arr(s.projects),s.audits,s.followNote,s.company,s.companyChinese,s.contactName,s.title,s.city,s.province,s.country,s.products,s.notes,s.wechat,s.research?.summary,...arr(s.research?.products),...arr(s.emails),...arr(s.phones),...arr(s.categories),
    ...quotesFor(s.id).flatMap(q=>arr(q.lines).map(l=>l.item+" "+(l.sku||""))), ...docsFor(s.id).map(d=>d.name)].join(" ").toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}

/* ---------- main render ---------- */
function render(){
  const sups=[...S.sup.values()];
  const nq = S.quotes.reduce((n,q)=>n+arr(q.lines).length,0);
  const openSamples = S.samples.filter(x=>!["Approved","Rejected"].includes(x.status)).length;
  $("#count").textContent = (S.loaded.s ? `${sups.length} factor${sups.length===1?"y":"ies"} · ${nq} quoted · ${openSamples} sample${openSamples===1?"":"s"} open` : "Loading…");
  $("#v-s").setAttribute("aria-pressed",S.view==="s");
  $("#v-t").setAttribute("aria-pressed",S.view==="t");
  $("#v-h").setAttribute("aria-pressed",S.view==="h"); $("#v-r").setAttribute("aria-pressed",S.view==="r"); { const n=S.loaded.s?[...S.sup.values()].filter(x=>x.replyWho==="me").length:0; $("#v-r").textContent=n?`Replies · ${n}`:"Replies"; }
  const nTodo=S.loaded.s?todoItems().length:0; $("#v-t").textContent=nTodo?`To do · ${nTodo}`:"To do";
  // categories
  const counts={};
  const bump=list=>{ const seen=new Set(); list.forEach(c=>{ [c,famOf(c)].forEach(k=>{ if(!seen.has(k)){ seen.add(k); counts[k]=(counts[k]||0)+1; } }); }); };
  if(S.view==="d") S.docs.filter(inDG).forEach(d=>bump([d.category||"Other"]));
  else sups.forEach(s=>bump(arr(s.categories)));
  const keys=Object.keys(counts);
  const fams=[...new Set(keys.map(famOf))].sort((x,y)=>x.localeCompare(y));
  if (S.cat!=="All" && !counts[S.cat]) S.cat="All";
  const openFam=S.cat==="All"?null:famOf(S.cat);
  const cats=["All"]; fams.forEach(f=>{ cats.push(f); if(f===openFam) keys.filter(k=>k!==f&&famOf(k)===f).sort((x,y)=>(/ – Other$/.test(x)-/ – Other$/.test(y))||x.localeCompare(y)).forEach(k=>cats.push(k)); });
  const allN = S.view==="d" ? S.docs.filter(inDG).length : sups.length;
  { const nc=S.docs.filter(d=>dgOf(d)==="cat").length, nf=S.docs.length-nc;
  $("#v-d").setAttribute("aria-pressed",S.view==="d"&&!S.dcat); $("#v-d").textContent=nf?`Files · ${nf}`:"Files";
  $("#v-c").setAttribute("aria-pressed",S.view==="d"&&S.dcat); $("#v-c").textContent=nc?`Catalogs · ${nc}`:"Catalogs"; }
  const usedProj=[...new Set(sups.flatMap(s=>arr(s.projects)))].sort();
  if(S.proj!=="All" && !usedProj.includes(S.proj)) S.proj="All";
  document.body.classList.toggle("tbl", (S.view==="f" && S.layout==="table") || S.view==="q" || S.view==="h");
  const qctl = S.view==="q" ? (customers().length?`<select id="custsel" class="chip" aria-label="Customer">${customers().map(c=>`<option ${c.name===activeCust()?.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`:"")+`<select id="qtypesel" class="chip" aria-label="Product type"><option value="All">All product types</option>${[...(S.qtypeCounts||new Map())].sort((a,b)=>a[0].localeCompare(b[0])).map(([t,n])=>`<option value="${esc(t)}" ${t===S.qtype?"selected":""}>${esc(t)} (${n})</option>`).join("")}${S.qtype!=="All"&&!(S.qtypeCounts||new Map()).has(S.qtype)?`<option selected>${esc(S.qtype)}</option>`:""}</select><select id="qfitsel" class="chip" aria-label="Fit"><option value="All">Any fit</option>${[["ok","Fits"],["tight","Tight"],["over","Over"],["none","No target retail"]].map(([v,t])=>`<option value="${v}" ${v===S.qfit?"selected":""}>${t}</option>`).join("")}</select><select id="qsortsel" class="chip" aria-label="Order of product types"><option value="count" ${S.qsort==="count"?"selected":""}>Most quotes first</option><option value="az" ${S.qsort==="az"?"selected":""}>A–Z</option></select><label class="chip" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="qaddons" ${S.addons?"checked":""}> Add-ons</label>` : "";
  const ltog = S.view==="f" ? `<span class="vtog" role="group" aria-label="Layout"><button data-layout="cards" aria-pressed="${S.layout!=="table"}">Cards</button><button data-layout="table" aria-pressed="${S.layout==="table"}">Table</button></span>` : "";
  $("#cats").innerHTML = ltog + qctl + (S.view==="f"&&S.layout!=="table"?`<select id="sortsel" class="chip" aria-label="Sort factories"><option value="month" ${S.sort==="month"?"selected":""}>By month added</option><option value="az" ${S.sort==="az"?"selected":""}>A–Z</option></select>`:"") + (S.view==="d"&&!S.dcat?DGS.map(([k,t])=>`<button class="chip" data-dg="${k}" aria-pressed="${S.dgroup===k}">${t}<span class="n">${S.docs.filter(d=>dgOf(d)===k).length}</span></button>`).join(""):"") + (S.view==="d"?`<select id="dtypesel" class="chip" aria-label="File type"><option value="All">All types</option>${DOCTYPES.filter(t=>S.docs.some(d=>inDG(d)&&docTypeOf(d)===t)).map(t=>`<option ${t===S.dtype?"selected":""}>${esc(t)}</option>`).join("")}</select>`:"") + (S.view!=="d"?`<select id="srcsel" class="chip" aria-label="Source"><option value="All">All sources</option>${["WeChat","Alibaba","Global Sources","Email","Card scan","Added by hand"].filter(x=>sups.some(s=>srcOf(s).includes(x))).map(x=>`<option ${x===S.src?"selected":""}>${esc(x)}</option>`).join("")}</select>`:"") + (usedProj.length&&S.view!=="d"?`<select id="projsel" class="chip" aria-label="Project"><option value="All">All projects</option>${usedProj.map(p=>`<option ${p===S.proj?"selected":""}>${esc(p)}</option>`).join("")}</select>`:"") + (()=>{ const ev=[...new Set(sups.map(x=>x.metAt).filter(Boolean))].sort(); if(S.met!=="All"&&!ev.includes(S.met)) S.met="All"; return ev.length&&S.view!=="d"?`<select id="metsel" class="chip" aria-label="Where you met"><option value="All">All events</option>${ev.map(x=>`<option ${x===S.met?"selected":""}>${esc(x)}</option>`).join("")}</select>`:""; })() + cats.map(c=>{ const sub=c!==famOf(c); const hasSub=!sub&&keys.some(k=>k!==c&&famOf(k)===c); return `<button class="chip${sub?" sub":""}" data-cat="${esc(c)}" aria-pressed="${c===S.cat}">${esc(sub?c.split(" – ").slice(1).join(" – "):c)}${hasSub&&c!==openFam?" ▾":""}<span class="n">${c==="All"?allN:counts[c]}</span></button>`; }).join("");
  $("#v-f").setAttribute("aria-pressed",S.view==="f"); $("#v-q").setAttribute("aria-pressed",S.view==="q");
  const L=$("#list");
  if (!db){ return; }
  if (!S.loaded.s){ L.innerHTML=`<div class="empty"><strong>Opening your Source Book…</strong></div>`; return; }
  const shown = sups.filter(matches).sort((a,b)=>String(a.company||"").localeCompare(String(b.company||"")));
  if (S.view==="f"){
    if (!sups.length){ L.innerHTML=`<div class="empty"><strong>No factories yet</strong><span>Snap a photo of a factory's business card and Claude fills in the contact for you. You can add quotes once it's saved.</span><button class="btn primary" data-act="add">＋ Add your first factory</button></div>`; return; }
    if (!shown.length){ L.innerHTML=`<div class="empty"><strong>Nothing matches</strong><span>Try another search or category.</span></div>`; return; }
    if (S.layout==="table"){ renderTable(L,shown); return; }
    const slip = s=>{
      const qn = quotesFor(s.id).reduce((n,q)=>n+arr(q.lines).length,0);
      const ini = (s.company||"?").replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase()||"?";
      return `<button class="slip${detailId===s.id?" on":""}" data-open="${esc(s.id)}">
        ${(s.cardFront||arr(s.cards)[0]?.file)?`<img class="thumb" src="${blobUrl(s.cardFront||arr(s.cards)[0].file)}" alt="">`:(()=>{ const p=quotesFor(s.id).flatMap(q=>arr(q.lines)).find(l=>l.img)||(()=>{ const sp=samplesFor(s.id).flatMap(x=>arr(x.photos))[0]; return sp?{img:blobUrl(sp)}:null; })(); return p?`<img class="thumb" style="object-fit:contain;background:#fff;aspect-ratio:1" src="${esc(p.img)}" alt="" loading="lazy">`:`<div class="thumb">${esc(ini)}</div>`; })()}
        <div class="body">
          <div class="name">${esc(s.company||"Unnamed factory")}</div>
          ${s.companyChinese?`<div class="cn">${esc(s.companyChinese)}</div>`:""}
          <div class="meta">${esc([s.contactName,[s.city,s.province].filter(Boolean).join(", ")].filter(Boolean).join(" · "))}</div>
          ${s.products?`<div class="meta">${esc(s.products)}</div>`:""}
          ${S.sort==="month"&&addedAt(s)?`<div class="meta">Added ${esc(new Date(addedAt(s)).toLocaleDateString("en-US",{month:"short",day:"numeric"}))}</div>`:""}
          <div class="tags">${srcBadges(s)}${arr(s.categories).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}${arr(s.projects).map(p=>`<span class="tag proj">${esc(p)}</span>`).join("")}${s.rating?`<span class="stars">${stars(s.rating)}</span>`:""}${qn?`<span class="qbadge">${qn} quoted</span>`:""}${(()=>{ const c=docsFor(s.id,"catalog").length, f=docsFor(s.id,"file").length; return (c||f)?`<span class="qbadge">${[c?`${c} catalog${c>1?"s":""}`:"",f?`${f} file${f>1?"s":""}`:""].filter(Boolean).join(" · ")}</span>`:""; })()}</div>
          ${(()=>{ const f=followState(s); return f&&f.cls?`<div class="flag ${f.cls}">${esc(f.txt)}${s.followNote?` · ${esc(s.followNote)}`:""}</div>`:""; })()}
        </div></button>`;
    };
    if (S.sort==="month"){
      const list=[...shown].sort((a,b)=>(addedAt(b)||0)-(addedAt(a)||0));
      const groups=new Map();
      list.forEach(s=>{ const t=addedAt(s); const k=t?new Date(t).toLocaleDateString("en-US",{month:"long",year:"numeric"}):"Date unknown"; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(s); });

    } else L.innerHTML = shown.map(slip).join("");
  } else if (S.view==="h"){ renderDash(L,shown);
  } else if (S.view==="r"){ renderReplies(L,shown);

    if(!items.length){ L.innerHTML=`<div class="empty"><strong>Nothing needs you right now</strong><span>Follow-ups that are due, samples waiting over ${SAMPLE_WAIT_DAYS} days, and quotes about to expire show up here.</span></div>`; return; }

    L.innerHTML=groups.map(([t,k])=>{ const g=items.filter(i=>i.kind===k); if(!g.length) return "";

  } else if (S.view==="d"){
    const term=S.q.toLowerCase();

const STOP=new Set("the a an and or for with of to in on by pcs pc set new style color colour box packing logo size mm cm inch usd fob moq".split(" "));
const toks=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w.length>1&&!STOP.has(w)).map(w=>w.length>3?w.replace(/(es|s)$/,""):w);
const groupOfType=t=>(TYPE_GROUPS.find(g=>g[1].includes(t))||[])[0]||"";
function similarPool(id){
  const want=new Set([...toks(id.name),...arr(id.keywords).flatMap(toks),...arr(id.features).flatMap(toks)]);
  const types=[id.type,...arr(id.alt_types)].filter(t=>ALL_TYPES.includes(t)), grp=new Set(types.map(groupOfType));
  const out=[];
  for(const q of S.quotes){ const s=S.sup.get(q.supplierId); if(!s) continue;
    arr(q.lines).forEach((l,li)=>{ if(!l||!l.item) return; const ty=typeOf(l); if(ty?.a) return;
      const t=ty?.t||""; let sc=0;
      const typeHit=t&&types[0]&&types[0]!=="Other"&&t===types[0]?10:(t&&types.includes(t)&&t!=="Other"?6:0);
      const it=new Set(toks(l.item+" "+(l.sku||""))); let hit=0; want.forEach(w=>{ if(it.has(w)) hit++; });
      sc=typeHit+hit*1.5+(t&&grp.has(groupOfType(t))&&hit?1:0);
      if(typeHit>=6||hit>=2) out.push({q,l,li,s,t,sc,typeHit}); }); }
  out.sort((a,b)=>b.sc-a.sc);
  // one row per identical item+factory
  const seen=new Set(); return out.filter(r=>{ const k=r.s.id+"|"+normItem(r.l.item); if(seen.has(k)) return false; seen.add(k); return true; });
}
async function identifyProduct(img, text){
  const ask=`Identify the product ${img?"in this photo taken in a retail store":"the shopper describes"} so a sourcing manager can find similar items in factory quotes.${text?` Shopper's note: "${text}".`:""}
Pick "type" from this list, using the exact text (use "Other" if nothing fits): ${JSON.stringify(ALL_TYPES)}
The product may be on a shelf, hanging on a peg hook, or still in its retail package. Read everything printed that you can make out:
- the brand and the product name or model number on the package or label;
- the description and selling points on the package (e.g. "15W fast charging", "3 modes", "BPA free", "pack of 2");
- specs such as size, capacity, wattage, battery, material and piece count;
- the shelf tag or price sticker under or above it (a peg-hook tag counts): the price, any sale or clearance price with the regular price, the unit price, and the retailer's item number or UPC if printed.
Only report what you can actually read or clearly see. Do not guess specs or prices. If a price is unclear, leave it "".

async function rankSimilar(id, cands, img){
  const list=cands.map((r,i)=>`${i+1}. ${String(r.l.item).replace(/\s+/g," ").slice(0,220)}${r.t?` [${r.t}]`:""}`).join("\n");
  const r=await sample.json(`A shopper photographed a product in a store. It was identified as: ${JSON.stringify({name:id.name,type:id.type,features:id.features,package_text:id.package_text,pack_count:id.pack_count,material:id.material,brand:id.brand})}

${list}
Reply with only JSON: {"matches":[{"i":1,"score":90,"why":""}]} with at most 12 matches, best first.`,img?{images:[img],modelTier:"default"}:{modelTier:"default"});
  const out=[]; for(const m of arr(r?.matches)){ const j=(+m?.i)-1; if(j>=0&&j<cands.length&&!out.some(o=>o.r===cands[j])) out.push({r:cands[j],score:+m.score||0,why:String(m.why||"").slice(0,120)}); }

/* ---------- online research: Claude searches the web and sorts the factory ---------- */
let detailId=null, autoResearch=null;
const running=new Map(); // id -> status text
let toolsOK=false;
const canResearch=()=>!!(sample && mcp && toolsOK && canWrite);
function researchHtml(s){
  const r=s.research, st=running.get(s.id);
  const btn = canResearch() ? `<button class="btn sm ${r?"":"primary"}" data-research ${st?"disabled":""}>${r?"Research again":"Research this factory"}</button>` : "";
  const head=`<div class="row" style="justify-content:space-between"><div class="label">What they make</div>${btn}</div>`;
  if (st) return head+`<div class="status">${esc(st)}</div>`;
  if (!r) return head+`<div class="note">${canResearch()?"Claude searches the web for this factory, lists its products, and picks categories for it.":"Online research isn't available in this view."}</div>`;
  const facts=[["Type",r.businessType],["Based in",r.location],["Since",r.founded],["Sells to",r.markets],["Certifications",arr(r.certifications).join(", ")]].filter(([,v])=>v);
  return head+`
    ${r.summary?`<div>${esc(r.summary)}</div>`:""}
    ${arr(r.products).length?`<div class="tags">${r.products.map(p=>`<span class="tag" style="text-transform:none;letter-spacing:0">${esc(p)}</span>`).join("")}</div>`:""}
    ${facts.length?`<dl class="kv">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}
    ${r.confidence?`<div class="note">Confidence: ${esc(r.confidence)}${r.caveat?` · ${esc(r.caveat)}`:""}</div>`:""}
    ${arr(r.sources).length?`<div class="links">${r.sources.slice(0,6).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc((x.title||x.url).slice(0,40))} ↗</a>`).join("")}</div>`:""}
    ${r.at?`<div class="note">Researched ${esc(new Date(r.at).toLocaleDateString())}</div>`:""}`;
}
function refreshResearch(id){
  if (detailId!==id) return;
  const sec=document.querySelector("#rsec"); const s=S.sup.get(id);
  if (sec && s){ sec.innerHTML=researchHtml(s); wireResearch(sec,id); }
}
function wireResearch(root,id){ const b=root.querySelector("[data-research]"); if(b) b.onclick=()=>runResearch(id); }
function parseSearch(res){
  let p=res?.payload;
  let str = typeof p==="string" ? p : (p && typeof p.result==="string" ? p.result : null);
  if (!str && p && typeof p==="object" && p.organic_results) return p;
  if (!str) str = (res?.content||[]).find(c=>c.type==="text")?.text || "";
  try{ let j=JSON.parse(str); if (j && typeof j.result==="string") j=JSON.parse(j.result); return j||{}; }catch{ return {}; }
}
async function runResearch(id){
  const s=S.sup.get(id); if(!s || running.has(id)) return;
  const set=t=>{ running.set(id,t); refreshResearch(id); };
  set("Starting research… this usually takes 30–90 seconds.");
  const found=[];
  const tools=[{
    name:"web_search",
    description:"Search Google for a company, its products or its listings (Alibaba, Made-in-China, its own website). Returns the top results with title, link and snippet.",
    inputSchema:{type:"object",properties:{query:{type:"string",description:"The search query"}},required:["query"]},
    async execute({query}){
      set(`Searching: ${query}`);
      const res=await mcp.callTool("serpapi","search",{params:{q:String(query),engine:"google_light"},mode:"compact"},{cache:{staleTime:300000}});
      const j=parseSearch(res);
      const out=(j.organic_results||[]).slice(0,6).map(o=>({title:o.title,link:o.link,snippet:o.snippet}));
      out.forEach(o=>found.push(o));
      return {results:out};
    }
  }];
  const card={company:s.company,companyChinese:s.companyChinese,website:s.website,city:s.city,province:s.province,country:s.country,address:s.address,emails:s.emails,productsOnCard:s.products,notes:s.notes};
  try{
    const r=await sample.json(
`You help a US importer's sourcing manager understand a Chinese factory he met. Here is what is on its business card:
${JSON.stringify(card)}

Use the web_search tool (2 to 4 searches) to find out what this company actually makes. Good queries: the English company name, the Chinese name, the name plus "Alibaba" or "Made-in-China", the website domain. Only report facts the search results support. If results don't clearly match this company, say so and keep the answer short. Do not guess founding years, certifications or markets.

Then pick categories for it. Prefer these existing categories: ${JSON.stringify(allCats())}. Add at most one new short category (1-3 words, Title Case) only if none fit.

Reply with only a JSON object:
{"summary":"2 sentences on what they make and who they are","products":["short product names, up to 10"],"categories":["..."],"businessType":"Manufacturer | Trading company | Manufacturer and trader | Unknown","location":"","founded":"","markets":"","certifications":[],"confidence":"High | Medium | Low","caveat":"one short line if the match is uncertain, else empty","sources":[{"title":"","url":""}]}`,
      {tools, modelTier:"default", cache:false});
    const research={
      summary:String(r?.summary||""), products:arr(r?.products).map(String).slice(0,12),
      businessType:String(r?.businessType||""), location:String(r?.location||""), founded:String(r?.founded||""), markets:String(r?.markets||""),
      certifications:arr(r?.certifications).map(String), confidence:String(r?.confidence||""), caveat:String(r?.caveat||""),
      sources:arr(r?.sources).filter(x=>x&&/^https?:/i.test(x.url||"")).map(x=>({title:String(x.title||""),url:String(x.url)})).slice(0,8),
      at:Date.now()
    };
    if(!research.summary && !research.products.length){ research.summary="Claude couldn't find reliable information about this factory online."; research.confidence=research.confidence||"Low"; }
    const cur=S.sup.get(id)||s;
    const cats=[...new Set([...arr(cur.categories),...arr(r?.categories).map(String).filter(Boolean)])];
    const patch={research, categories:cats, updatedAt:Date.now()};
    if(!cur.products && research.products.length) patch.products=research.products.slice(0,5).join(", ");
    await db.doc("suppliers/"+id).update(patch);
    running.delete(id);
    toast(`Researched ${cur.company||"factory"}`);
    refreshResearch(id);
    if(detailId===id) setTimeout(()=>openFactory(id),50);
  }catch(e){
    running.delete(id); refreshResearch(id);
    const msg = e?.code==="not_granted"?"Research needs your OK to use Claude and SerpApi. Tap Research again and allow it."
      : e?.code==="rate_limited"?"Too many requests right now. Try again in a minute."
      : e?.code==="tool_error"||e?.code==="server_not_connected"?"The web search connection didn't answer. Check that SerpApi is connected, then try again."
      : "Research didn't finish. Try again.";
    toast(msg);
  }
}

/* ---------- category picker ---------- */
function catPicker(selected){
  const sel=new Set(arr(selected));
  const html=`<div class="sec"><div class="label">Categories</div><div class="tabs" style="flex-wrap:wrap" id="cp">${allCats().map(c=>`<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${sel.has(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="row"><input id="newcat" class="search" placeholder="New category" aria-label="New category"><button type="button" class="btn sm" id="addcat">Add</button></div></div>`;
  const mount=body=>{
    const cp=body.querySelector("#cp");
    cp.addEventListener("click",e=>{ const b=e.target.closest("[data-c]"); if(!b) return; const c=b.dataset.c; sel.has(c)?sel.delete(c):sel.add(c); b.setAttribute("aria-pressed",sel.has(c)); });
    const add=()=>{ const v=body.querySelector("#newcat").value.trim(); if(!v) return; sel.add(v); body.querySelector("#newcat").value="";
      if(!cp.querySelector(`[data-c="${CSS.escape(v)}"]`)){ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.dataset.c=v; b.textContent=v; cp.append(b); }
      cp.querySelector(`[data-c="${CSS.escape(v)}"]`).setAttribute("aria-pressed","true"); };
    body.querySelector("#addcat").onclick=add;
    body.querySelector("#newcat").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); }});
  };
  return {html, mount, get:()=>[...sel]};
}

/* ---------- business cards on a contact ---------- */
function cardList(s){
  const out=[];
  if(s.cardFront) out.push({file:s.cardFront,label:"Front",legacy:"cardFront"});
  if(s.cardBack) out.push({file:s.cardBack,label:"Back",legacy:"cardBack"});
  arr(s.cards).forEach((c,i)=>{ if(c&&c.file) out.push({...c,idx:i}); });
  return out;
}
function cardSection(s){
  const cs=cardList(s);
  if(!cs.length && !canWrite) return "";
  const canAdd=canWrite&&!!assets;
  return `<div class="sec" id="bcsec"><div class="row" style="justify-content:space-between"><div class="label">Business cards</div>${canAdd?`<label class="btn sm primary" style="cursor:pointer">＋ Add card photo<input type="file" accept="image/*" id="bc-add" multiple hidden></label>`:""}</div>
    ${cs.length?`<div class="bcgrid">${cs.map((c,k)=>`<figure class="bc"><a href="${blobUrl(c.file)}" target="_blank" rel="noopener"><img src="${blobUrl(c.file)}" alt="Business card" loading="lazy"></a><figcaption>${esc([c.label||"Card",c.person,c.source].filter(Boolean).join(" · "))}</figcaption>${canWrite?`<div class="row">${sample&&imgOK?`<button class="btn sm" data-bcread="${k}">Fill in details</button>`:""}<button class="btn sm ghost" data-bcdel="${k}">Remove</button></div>`:""}</figure>`).join("")}</div>`
      :`<div class="note">No business card yet. Take a photo of their card, or save the card image from WeChat to your phone or computer and add it here.${sample&&imgOK?" Claude will read it and fill in any missing contact details.":""}</div>`}
    <div class="status" id="bc-st"></div></div>`;
}
async function fillFromCard(s, imgBlob){ return fillPatch(s, await readCard([imgBlob])); }
function fillPatch(s, r){
  const patch={}, filled=[];
  const keys=[["companyChinese","Chinese name"],["contactName","contact"],["title","title"],["wechat","WeChat"],["whatsapp","WhatsApp"],["website","website"],["address","address"],["city","city"],["province","province"]];
  for(const [k,label] of keys){ const v=String(r?.[k]||"").trim(); if(v && !String(s[k]||"").trim()){ patch[k]=v; filled.push(label); } }
  for(const k of ["phones","emails"]){ const have=arr(s[k]).map(x=>String(x).toLowerCase()); const add=arr(r?.[k]).map(x=>String(x).trim()).filter(x=>x&&!have.includes(x.toLowerCase())); if(add.length){ patch[k]=[...arr(s[k]),...add]; filled.push(k==="phones"?"phone":"email"); } }
  const person=String(r?.contactName||"").trim();
  if(person && s.contactName && person.toLowerCase()!==String(s.contactName).toLowerCase() && !String(s.notes||"").includes(person)){
    const line=`Also on a business card: ${[person,r.title,arr(r.phones).join(", "),arr(r.emails).join(", "),r.wechat?("WeChat "+r.wechat):""].filter(Boolean).join(" · ")}`;
    patch.notes=((s.notes||"")+(s.notes?"\n":"")+line).slice(0,4000); filled.push("second contact (in notes)");
  }
  return {patch, filled, person};
}
function wireCards(body,s){
  const st=body.querySelector("#bc-st");
  const say=(m,c="")=>{ if(st){ st.textContent=m; st.className="status "+c; } };
  const errMsg=e=>e?.code==="not_granted"?"Claude wasn't allowed to read it.":e?.code==="rate_limited"?"Too many requests. Try again in a minute.":"Couldn't read the card. Try a sharper photo.";
  const cs=cardList(s);
  body.querySelector("#bc-add")?.addEventListener("change",async e=>{
    const fs=[...e.target.files]; if(!fs.length) return;
    say(`Saving ${fs.length} photo${fs.length>1?"s":""}…`);
    try{
      const add=[], blobs=[];
      for(const f of fs){ const b=await shrink(f); const up=await assets.upload(b); add.push({file:up.id,label:"Card",source:"Added "+today(),addedAt:Date.now()}); blobs.push(b); }
      let patch={cards:[...arr(s.cards),...add],updatedAt:Date.now()}, note="Card saved";
      if(sample&&imgOK){
        say("Saved. Reading the card… this can take 20–40 seconds.");
        try{ const r=await fillFromCard(s, blobs[0]); if(r.person) add[0].person=r.person; patch={...patch,...r.patch,cards:[...arr(s.cards),...add]}; note=r.filled.length?`Card saved. Added ${r.filled.join(", ")}.`:"Card saved. Nothing new to fill in."; }
        catch(err){ note="Card saved. "+errMsg(err); }
      }
      await db.doc("suppliers/"+s.id).update(patch);

async function readCardSafe(imgs){
  try{ return await readCard(imgs); }
  catch(e){
    if(e?.code==="invalid_json"&&e.text){ const m=String(e.text).match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(_){} } }
    if(e?.code==="image_rejected"||e?.code==="prompt_too_large"){ const small=[]; for(const b of imgs) small.push(await shrink(b,1100)); return await readCard(small); }
    if(e?.code==="invalid_json"||e?.code==="empty_completion"||e?.code==="upstream_error"){ return await readCard(imgs.slice(0,1)); }
    throw e;
  }
}

const normCo=v=>String(v||"").toLowerCase().replace(/\(.*?\)|（.*?）/g," ").replace(/\b(co|company|ltd|limited|inc|corp|corporation|llc|group|industrial|industry|trading|technology|tech|manufacturing|mfg|factory|import|export|imp|exp)\b\.?/g," ").replace(/有限公司|有限责任公司|公司|工厂|厂/g,"").replace(/[^a-z0-9\u4e00-\u9fff]+/g,"");
const normPh=v=>{ const d=String(v||"").replace(/\D/g,""); return d.length>=8?d.slice(-9):""; };
function findDuplicate(name, excludeId){
  const n=normCo(name); if(!n||n.length<3) return null;
  for(const s of S.sup.values()) if(s.id!==excludeId && [s.company,s.companyChinese].some(x=>normCo(x)===n)) return s;
  return null;
}
function findMatch(r, excludeId){
  const em=new Set(arr(r?.emails).map(x=>String(x).trim().toLowerCase()).filter(Boolean));
  const ph=new Set(arr(r?.phones).concat(r?.whatsapp?[r.whatsapp]:[]).map(normPh).filter(Boolean));
  const wc=String(r?.wechat||"").trim().toLowerCase();
  for(const s of S.sup.values()){ if(s.id===excludeId) continue;
    if(arr(s.emails).some(x=>em.has(String(x).trim().toLowerCase()))) return {s,why:"same email"};
    if(ph.size && arr(s.phones).concat(s.whatsapp?[s.whatsapp]:[]).some(x=>ph.has(normPh(x)))) return {s,why:"same phone"};
    if(wc && String(s.wechat||"").trim().toLowerCase()===wc) return {s,why:"same WeChat"};
  }
  const d=findDuplicate(r?.company,excludeId)||findDuplicate(r?.companyChinese,excludeId);
  return d?{s:d,why:"same company name"}:null;
}

    };
    body.querySelector("#savef").onclick=async()=>{
      const ss=body.querySelector("#ss"); const btn=body.querySelector("#savef");
      const g=k=>body.querySelector("#ff-"+k).value.trim();

      doc.projects=pp.get(); doc.rating=body._rating(); doc.audits=g("audits"); doc.visited=g("visited"); doc.followUp=g("followUp"); doc.followNote=g("followNote");
      if(!doc.company && !doc.companyChinese){ st(ss,"Add a company name first.","err"); return; }
      const mt=findMatch(doc, s.id); const dup=mt?.s;
      if(dup && !body._dupOK){ st(ss,`${dup.company||dup.companyChinese} is already in your book (${mt.why}). Tap Save again to add it anyway, or close this and open that factory.`,"err"); body._dupOK=true; return; }
      if(!existing && me) doc.addedBy=me;
      if(!doc.source && (files.front||files.back)) doc.source="card-photo";
      btn.disabled=true; st(ss,"Saving…");
      try{
        if(assets){
          for(const side of ["front","back"]) if(files[side]){
            const up=await assets.upload(files[side]); doc["card"+side[0].toUpperCase()+side.slice(1)]=up.id;
          }
        } else if(files.front||files.back){ st(ss,"Saving without card photos (photo storage is off in this view)…"); }
        doc.updatedAt=Date.now(); if(!existing) doc.createdAt=Date.now();
        const ref = existing ? db.doc("suppliers/"+s.id) : db.collection("suppliers").doc();

        btn.disabled=false;
        st(ss, e.code==="quota_exceeded"?"Storage is full. Delete old factories or photos to add more.":"Couldn't save ("+(e.code||"error")+"). Try again.","err");
      }
    };
  });
}

    if(f && f.cls) out.push({kind:"follow",sid:s.id,title:s.company||s.companyChinese||"Factory",sub:s.followNote||"Follow up",badge:f.txt,cls:f.cls,sort:Date.parse(s.followUp)}); }
  for(const x of S.samples){ if(!ids.has(x.supplierId)) continue; const st=x.status||"Requested"; const d=daysSince(x.requested);
    if((st==="Requested"||st==="Shipped") && d!=null && d>=SAMPLE_WAIT_DAYS) out.push({kind:"sample",sid:x.supplierId,title:`${x.item||"Sample"} · ${S.sup.get(x.supplierId)?.company||""}`,sub:`${st}${x.tracking?` · ${x.tracking}`:""}`,badge:`${d} days waiting`,cls:d>=SAMPLE_WAIT_DAYS*2?"exp":"soon",sort:-d}); }
  for(const q of S.quotes){ if(!ids.has(q.supplierId)) continue; const e=quoteExpiry(q);

  return out.sort((a,b)=>a.sort-b.sort);
}

Write only the corrected message, nothing else.`,"Fixing…");

Purpose: ${v("#m-purpose")}. Tone: ${v("#m-tone")}.
Language: ${langTxt()}.
Sign as: ${sign()||"(no signature)"}.
What the sender wants to say: ${txt||"nothing extra"}.
${s?`What we know about this factory (use only what is relevant; never invent prices, dates or quantities): ${JSON.stringify(ctx())}`:"Do not invent prices, dates, quantities or names; use placeholders like [quantity] only if needed."}
Write only the message text, nothing else.`,"Writing…");
      }
    };
    body.querySelectorAll("[data-redo]").forEach(b=>b.onclick=()=>{
      const cur=out.value.trim(); if(!cur) return;
      const how={"Shorter":"Make it shorter and more direct, keeping every fact, number and request.","More polite":"Make it warmer and more polite, keeping every fact, number and request.","Firmer":"Make it firmer and more direct (still professional), keeping every fact, number and request.","Fix grammar only":"Only fix spelling, grammar and punctuation. Change nothing else.","Add Chinese":"Keep the English as is and add the same message in Simplified Chinese below it. If it already has Chinese, correct the Chinese so it matches the English."}[b.dataset.redo];

Message:
"""${cur}"""
Write only the revised message, nothing else.`,b.dataset.redo+"…");

    const io=new IntersectionObserver(es=>es.forEach(async e=>{ if(!e.isIntersecting) return; const c=e.target.querySelector("canvas"); io.unobserve(e.target);
      try{ const page=await pdf.getPage(+c.dataset.p); const v0=page.getViewport({scale:1}); const v=page.getViewport({scale:Math.max(W/v0.width*dpr,1.6)}); c.width=v.width; c.height=v.height; c.style.height=(W*v.height/v.width)+"px"; await page.render({canvasContext:c.getContext("2d"),viewport:v}).promise; c._page=page; c._vp=v; c._ready=true; }catch(err){} }),{root:body,rootMargin:"1200px 0px"});
    for(let i=1;i<=pdf.numPages;i++){ const c=document.createElement("canvas"); c.dataset.p=i; c.style.width=W+"px"; c.style.height=H+"px"; const w=wrap(c,async rect=>{ try{ if(!c._page) return ""; const tc=await c._page.getTextContent(); const sc=c._vp.scale; const box={x0:rect.x/sc,y0:rect.y/sc,x1:(rect.x+rect.w)/sc,y1:(rect.y+rect.h)/sc}; const vh=c._vp.height/sc, pad=60;
        return tc.items.filter(t=>{ const x=t.transform[4], y=vh-t.transform[5]; return x>box.x0-pad&&x<box.x1+pad&&y>box.y0-pad&&y<box.y1+pad; }).map(t=>t.str).join(" ").replace(/\s+/g," ").trim(); }catch{ return ""; } }); io.observe(w); }
  }catch(e){ if(tok!==viewTok) return; body.innerHTML=`<div class="status err">Couldn't open this file here.</div>`; }

    w.addEventListener("pointerup",async e=>{ if(!st) return; const p=pos(e), s0=st; st=null; const k=c.width/p.b.width;

async function buildRfqXlsx(s,R){

    for(let c=1;c<=cols.length;c++){ const cell=row.getCell(c); cell.border=border; cell.alignment={wrapText:true,vertical:"middle"}; if(c>=6) cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF2CC"}}; }

        const buf=await b.arrayBuffer(); const ext=(b.type||"").includes("png")?"png":"jpeg"; const id=wb.addImage({buffer:buf,extension:ext});
        const bm=await createImageBitmap(b); const maxW=160,maxH=125; const k=Math.min(maxW/bm.width,maxH/bm.height,1);
        ws.addImage(id,{tl:{col:0.1,row:rn-1+0.08},ext:{width:Math.round(bm.width*k),height:Math.round(bm.height*k)},editAs:"oneCell"}); }catch(e){} }
  }

  [["RFQ from "+[S.settings.signName,S.settings.signCompany].filter(Boolean).join(", ")],["To: "+[s.company,s.contactName].filter(Boolean).join(" · ")],["RFQ: "+(R.title||"")+(R.due?`   ·   Please reply by ${R.due}`:"")],["Quote on quantity: "+(R.qty||"10,000 pcs")],R.notes?["Notes: "+R.notes]:null,[""],

   ["Product image: paste the image into the sheet. Do not lock the image into the cell, otherwise we won't see it."],
   ["China Product FOB Cost: insert the China FOB price. Unless we specify otherwise, please quote based on 10K."],
   ["China / Other Country Packaging Cost: we need packaging cost broken out separately."],
   ["Other Country Product FOB Cost: the FOB quote ONLY for manufacturing outside of China. We do NOT trans-ship or do DDP."],
   ["Duty Rate: the duty rate for FOB China only."],
   ["40' HQ Container Quantity: critical so we can calculate freight and our estimated landed cost."]].filter(Boolean).forEach(([t],i)=>{ const c=info.getCell(i+1,1); c.value=t; c.alignment={wrapText:true}; if(i<5) c.font={bold:true}; });
  const add=wb.addWorksheet("Additional Items You Recommend");
  add.columns=[["Product Image",24],["Product Name",28],["Detailed Description",46],["China Product FOB Cost",14],["China Packaging Cost",14],["China FOB Port",14],["Other Country Product FOB Cost",16],["Other Country Packaging Cost",16],["Other Country  FOB Port",16],["HTS Code",14],["Duty Rate",10],["Unit Dimensions",18],["40' HQ Container Quantity",14]].map(([h,w])=>({header:h,width:w}));

    });

      go.disabled=true; const research=!!body.querySelector("#bk-r")?.checked; let saved=0, skipped=0;

        if(it.done) continue;
        it.msg="Reading…"; it.cls=""; draw();
        try{
          const r=await readCard([it.blob]);

          it.name=name||"Unreadable card";

          { const mt=findMatch(r); if(mt){ it.msg=`Already in your book (${mt.s.company||mt.s.companyChinese}, ${mt.why}), skipped`; it.done=true; skipped++; draw(); continue; } }
          it.msg="Saving…"; draw();
          const doc={}; F_FIELDS.forEach(([k])=>doc[k]=["phones","emails"].includes(k)?arr(r[k]).map(String):String(r[k]||""));
          doc.address=String(r.address||""); doc.products=String(r.products||""); doc.categories=arr(r.categories).map(String); doc.projects=[]; doc.notes=""; doc.source="card-scan";
          if(assets){ const up=await assets.upload(it.blob); doc.cardFront=up.id; }
          doc.createdAt=doc.updatedAt=Date.now(); if(me) doc.addedBy=me;
          const ref=db.collection("suppliers").doc(); await ref.set(doc);
          S.sup.set(ref.id,{id:ref.id,...doc});
          saved++; it.done=true; it.msg="Saved"; it.cls="ok"; draw();
          if(research){ it.msg="Saved · researching online…"; draw(); await runResearch(ref.id); it.msg="Saved and researched"; draw(); }
        }catch(e){ it.msg=e?.code==="rate_limited"?"Too many requests. Tap the button again in a minute.":"Couldn't read this card"; it.cls="err"; draw(); if(e?.code==="rate_limited"||e?.code==="not_granted") break; }
      }
      st.textContent=`${saved} saved${skipped?`, ${skipped} skipped`:""}.`; st.className="status ok";
      go.disabled=!items.some(i=>!i.done);
    };
  });
}

/* ---------- catalogs & files ---------- */
const DOCKIND={catalog:{title:"Catalogs",add:"＋ Add catalog",empty:"No catalogs yet."},file:{title:"Files",add:"＋ Add file",empty:"No files yet."}};
const DOCTYPES=["Catalog","Price list","Quotation","RFQ response","Proforma invoice","Sample request / costs","Product specs","Packaging & artwork","Contract / NDA","Test report / certificate","Other"];
function guessType(name,kind){ const s=String(name||"").toLowerCase();
  if(kind==="catalog") return "Catalog";
  if(/\bpi\b|pi[-_ #]|proforma|invoice/.test(s)) return "Proforma invoice";
  if(/sample/.test(s)) return "Sample request / costs";
  if(/nda|contract|agreement/.test(s)) return "Contract / NDA";
  if(/test|report|certif|\bce\b|fcc|rohs|ul\b/.test(s)) return "Test report / certificate";
  if(/pkg|packag|artwork|dieline|die line|label|silk/.test(s)) return "Packaging & artwork";
  if(/spec/.test(s)) return "Product specs";
  if(/price list|full list|top seller/.test(s)) return "Price list";
  if(/rfq/.test(s)) return "RFQ response";
  if(/catalog|catalogue|brochure/.test(s)) return "Catalog";
  return "Quotation"; }
const docTypeOf=d=>d.docType||guessType(d.name,d.kind);
function docsFor(id,kind){ return S.docs.filter(d=>d.supplierId===id && (!kind||d.kind===kind)).sort((a,b)=>DOCTYPES.indexOf(docTypeOf(a))-DOCTYPES.indexOf(docTypeOf(b))||String(a.name||"").localeCompare(String(b.name||""))); }
const fsize=n=>{ n=num(n); if(n==null) return ""; return n>=1e6?(n/1e6).toFixed(1)+" MB":Math.max(1,Math.round(n/1e3))+" KB"; };
function docRow(d,showFactory){
  const sup=S.sup.get(d.supplierId);
  return `<div class="drow">
      <span class="dic">${/\.(png|jpe?g|webp|gif|heic)$/i.test(d.name||"")?"IMG":isSheetName(d.name)?"XLS":"PDF"}</span>
      <div class="dmain"><a href="${blobUrl(d.file)}" target="_blank" rel="noopener">${esc(d.name||"File")}</a>
        <div class="dtags"><span class="tag">${esc(docTypeOf(d))}</span>${isExt(d.file)?`<span class="tag" title="Stored in your OneDrive: Documents › Source Book Files">OneDrive</span>`:""}${d.category?`<span class="tag proj">${esc(d.category)}</span>`:""}${showFactory&&sup?`<button class="linkbtn" data-open="${esc(d.supplierId)}">${esc(sup.company||"Factory")}</button>`:""}</div>
        <div class="note">${esc([fsize(d.size),d.source?`from ${d.source}`:"",d.createdAt?new Date(d.createdAt).toLocaleDateString("en-US",{month:"short",day:"numeric"}):""].filter(Boolean).join(" · "))}</div></div>
      <div class="row" style="gap:4px">${downloads?`<button class="btn sm ghost" data-dl="${esc(d.id)}">Download</button>`:""}${canWrite?`<button class="btn sm ghost" data-dedit="${esc(d.id)}">Edit</button><button class="btn sm ghost" data-ddel="${esc(d.id)}" aria-label="Remove ${esc(d.name||"file")}">Remove</button>`:""}</div>
      <div class="dconf" data-dconf="${esc(d.id)}"></div>
    </div>`;
}
function docSection(id,kind){
  const K=DOCKIND[kind], list=docsFor(id,kind);
  const can=canWrite&&assets;
  const byType=new Map(); list.forEach(d=>{ const t=docTypeOf(d); if(!byType.has(t)) byType.set(t,[]); byType.get(t).push(d); });
  const showSub = kind==="file" && byType.size>1;

    ${list.length?[...byType].map(([t,g])=>`${showSub?`<div class="dsub">${esc(t)} · ${g.length}</div>`:""}<div class="dlist">${g.map(d=>docRow(d,false)).join("")}</div>`).join(""):`<div class="note">${K.empty}${can?" PDFs and photos up to 20 MB. For Excel or Word files, save as PDF first.":""}</div>`}
    <span class="status" data-dst="${kind}"></span>
  </div>`;
}
function refreshDocs(id){

function allDocCats(){ const set=new Set(allCats()); S.docs.forEach(d=>d.category&&set.add(d.category)); return [...set].sort(); }
function wireDocs(root,id){
  root.querySelectorAll("[data-up]").forEach(inp=>inp.addEventListener("change",async e=>{
    const kind=inp.dataset.up, st=root.querySelector(`[data-dst="${kind}"]`)||document.querySelector(`[data-dst="${kind}"]`);
    const files=[...e.target.files]; if(!files.length) return;
    const sup=S.sup.get(id)||{}; let ok=0;
    for(const f of files){
      if(!/^(application\/pdf|image\/)/.test(f.type)){ st.textContent=`${f.name}: only PDFs and photos can be stored. Save Excel or Word files as PDF first.`; st.className="status err"; continue; }
      st.textContent=`Uploading ${f.name}…`; st.className="status";
      try{
        const up=await assets.upload(f);
        const ref=db.collection("docs").doc();
        await ref.set({supplierId:id,kind,name:f.name,file:up.id,size:up.sizeBytes||f.size,docType:guessType(f.name,kind),category:arr(sup.categories)[0]||"Other",source:"Uploaded",createdAt:Date.now(),updatedAt:Date.now(),...(me?{addedBy:me}:{})});
        ok++;
      }catch(err){ st.textContent=`${f.name}: `+(err?.code==="too_large"||/large/i.test(err?.message||"")?"too large (20 MB max).":"couldn't upload. Try again."); st.className="status err"; }
    }
    if(ok){ st.textContent=""; toast(`${ok} ${kind==="catalog"?"catalog":"file"}${ok>1?"s":""} added. Tap Edit to change its type or category.`); }
  }));
  root.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{
    const d=S.docs.find(x=>x.id===b.dataset.dl); if(!d) return;
    b.disabled=true; const old=b.textContent; b.textContent="Preparing…";
    if(isExt(d.file)){ window.open(d.file,"_blank","noopener"); b.disabled=false; b.textContent=old; return; }
    try{ const r=await fetch(blobUrl(d.file)); const blob=await r.blob(); let name=d.name||"file.pdf"; if(!/\.(pdf|png|jpe?g|webp|gif)$/i.test(name)) name+=".pdf"; await downloads.save({filename:name,data:blob}); }
    catch(e){ if(e?.code && !["declined"].includes(e.code)) toast("Download didn't finish. Use the file link to open it instead."); }
    finally{ b.disabled=false; b.textContent=old; }
  });
  root.querySelectorAll("[data-dedit]").forEach(b=>b.onclick=()=>{
    const d=S.docs.find(x=>x.id===b.dataset.dedit); if(!d) return;

    </div><div class="row"><button class="btn sm primary" data-ds>Save</button><button class="btn sm" data-dc>Cancel</button></div></div>`;
    box.querySelector("[data-dc]").onclick=()=>box.innerHTML="";
    box.querySelector("[data-ds]").onclick=async()=>{

  });

    box.innerHTML=`<div class="confirm"><span>Remove this from the factory?</span><div class="row"><button class="btn danger sm" data-y>Remove</button><button class="btn sm" data-n>Keep</button></div></div>`;
    box.querySelector("[data-n]").onclick=()=>box.innerHTML="";
    box.querySelector("[data-y]").onclick=async()=>{ try{ await db.doc("docs/"+b.dataset.ddel).delete(); toast("Removed"); }catch(e){ toast("Couldn't remove: "+(e.code||"error")); } };

function samplesFor(id){ return S.samples.filter(x=>x.supplierId===id).sort((a,b)=>String(b.requested||"").localeCompare(String(a.requested||""))); }
function daysSince(d){ if(!d) return null; const t=Date.parse(d); return isNaN(t)?null:Math.floor((Date.now()-t)/864e5); }
function sampleCard(x,inList){
  const st=x.status||"Requested";
  const wait = (st==="Requested"||st==="Shipped") ? daysSince(x.requested) : null;
  const sup=S.sup.get(x.supplierId);
  const meta=[x.requested?`Requested ${x.requested}`:"", x.received?`Received ${x.received}`:"", wait!=null?`${wait} day${wait===1?"":"s"} waiting`:"", num(x.cost)!=null?`Cost ${money(x.cost,x.currency||"USD")}`:"", x.tracking?`Tracking ${x.tracking}`:""].filter(Boolean).join(" · ");
  const body=`<div class="top"><div class="ttl">${esc(x.item||"Sample")}${inList&&sup?`<div class="note">${esc(sup.company||"")}</div>`:""}</div>
      ${inList||!canWrite?`<span class="st st-${st}">${st}</span>`:`<select data-sstat="${esc(x.id)}" aria-label="Sample status">${STATUSES.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select>`}</div>
    ${meta?`<div class="note">${esc(meta)}</div>`:""}
    ${x.notes?`<div>${esc(x.notes)}</div>`:""}
    ${arr(x.photos).length?`<div class="photos">${x.photos.map(p=>inList?`<img src="${blobUrl(p)}" alt="Sample photo">`:`<a href="${blobUrl(p)}" data-name="${esc(x.item||"Sample")} photo"><img src="${blobUrl(p)}" alt="Sample photo"></a>`).join("")}</div>`:""}
    ${!inList&&canWrite?`<div class="row"><button class="btn sm ghost" data-edits="${esc(x.id)}">Edit / add photos</button></div>`:""}`;
  return inList ? `<button class="scard" data-open="${esc(x.supplierId)}">${body}</button>` : `<div class="scard">${body}</div>`;
}

function csv(rows){ return rows.map(r=>r.map(c=>{ const s=String(c??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\n"); }
async function exportCsv(){
  if(!downloads){ toast("Export isn't available in this view"); return; }
  const rows=[["Factory","Chinese name","Contact","Title","Phones","Emails","WeChat","City","Province","Country","Categories","Makes","Quote date","Terms","Port","Currency","Item","SKU","Unit price","MOQ","Lead time","Valid until","Landed USD","Product type","Target retail","Max landed","Margin on customer cost %","Fit"]];
  for(const s of S.sup.values()){
    const base=[s.company,s.companyChinese,s.contactName,s.title,arr(s.phones).join(" / "),arr(s.emails).join(" / "),s.wechat,s.city,s.province,s.country,arr(s.categories).join(" / "),s.products];
    const qs=quotesFor(s.id);
    if(!qs.length) rows.push(base);
    qs.forEach(q=>arr(q.lines).forEach(l=>rows.push([...base,q.date,q.incoterm,q.port,q.currency,l.item,l.sku,l.price,l.moq,q.leadTime,q.validUntil,...(()=>{ const ty=typeOf(l); const f=fitFor(q,l,ty&&!ty.a?ty.t:null); return [f?.lc?f.lc.total.toFixed(3):"", ty?(ty.a?"Add-on":ty.t):"", f?.retail!=null?f.retail.toFixed(2):"", f?.retail!=null?f.maxL.toFixed(3):"", f?.retail!=null?(f.margin*100).toFixed(1):"", f?.retail!=null?({ok:"Fits",tight:"Tight",over:"Over"})[f.st]:""]; })()])));
  }
  try{ await downloads.save({filename:`source-book-${today()}.csv`, data:"﻿"+csv(rows)}); }catch(e){ if(e?.code && e.code!=="declined" && e.code!=="cancelled") toast("Export didn't finish"); }
}

// Each scan is kept on this device first (IndexedDB), so nothing is lost if the signal drops.

const scanMem=new Map(); let scanIdb=null, scanBusy=false;
function scanDb(){ if(scanIdb!==null) return Promise.resolve(scanIdb);
