async function scanDel(id){ const d=await scanDb(); if(!d) return; try{ await new Promise(ok=>{ const t=d.transaction("q","readwrite"); t.objectStore("q").delete(id); t.oncomplete=ok; t.onerror=ok; }); }catch(e){} }
async function scanLoad(){ const d=await scanDb(); if(!d) return; try{ const all=await new Promise(ok=>{ const rq=d.transaction("q").objectStore("q").getAll(); rq.onsuccess=()=>ok(rq.result||[]); rq.onerror=()=>ok([]); }); all.forEach(it=>{ if(!scanMem.has(it.id)) scanMem.set(it.id,{...it,status:"wait",msg:"Waiting to finish"}); }); }catch(e){} }
async function scanResume(){ await scanLoad(); if([...scanMem.values()].some(i=>i.status!=="done")) toast("Finishing card scans from last time…"); processScans(); }
window.addEventListener("online",()=>processScans());
function scanPending(){ return [...scanMem.values()].filter(i=>i.status!=="done"&&i.status!=="stuck").length; }
function scanBadge(){ if(!sample){ dropBadge(); return; } const n=scanPending(); const b=$("#add"); if(b) b.textContent=n?`Scan card · ${n} reading`:"Scan card"; }
const remember=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} };

/* Two passes: all fronts scanned, then the stack flipped and all backs scanned.
   Reads what identifies each side, then pairs backs to fronts. Returns {pairs:[{b,sure}], order}. */
async function describeSides(imgs,label,progress){
  const lim=await sample.limits(); const K=Math.max(1,Math.min(8,lim?.images?.maxCount||2));
  const out=[];
  for(let i=0;i<imgs.length;i+=K){
    const part=imgs.slice(i,i+K); progress&&progress(`Reading ${label} ${i+1}–${i+part.length} of ${imgs.length}…`);
    const th=[]; for(const b of part) th.push(await shrink(b,800));
    let r=null;
    try{ r=await sample.json(
`These ${part.length} photos each show one side of a business card (the ${label}). For each photo, in order, note everything that could identify which card it belongs to: company name in English and in Chinese, person name (English and Chinese), phone numbers, email, website, WeChat/QQ, address city, logo description, main colors, language. If the side is blank or only a pattern, say so.
Reply with only JSON: {"cards":[{"n":1,"company":"","companyChinese":"","person":"","personChinese":"","phones":[],"email":"","website":"","city":"","logo":"","colors":"","language":"","blank":false}]}`,
      {images:th,modelTier:"default"}); }
    catch(e){ if(e&&(e.code==="rate_limited"||e.code==="not_granted")) throw e; }
    const c=arr(r?.cards); for(let j=0;j<part.length;j++) out.push(c[j]||{});
  }
  return out;
}
async function matchTwoPass(F,B,progress){
  const df=await describeSides(F,"fronts",progress), dbk=await describeSides(B,"backs",progress);
  progress&&progress("Matching backs to fronts…");
  const r=await sample.json(
`Match business-card backs to their fronts. The person scanned every front, then flipped the whole stack and scanned the backs. So the backs are usually in the same order or in reverse order, but cards with nothing on the back may have been left out, and a few may be out of place.
Match on shared details: company name (English, Chinese, pinyin or translation of each other), person name in either language, phone numbers (compare digits), email or website domain, city, logo and colors. Use position (same or reverse order) to decide blank backs and close calls.
Fronts: ${JSON.stringify(df.map((x,i)=>({front:i+1,...x})))}
Backs: ${JSON.stringify(dbk.map((x,i)=>({back:i+1,...x})))}
Reply with only JSON: {"order":"same|reverse|mixed","pairs":[{"front":1,"back":2,"sure":true}]} with one entry per front. back is null when no back belongs to that front. Use each back at most once. sure=false when the match rests only on position or is a guess.`,
    {modelTier:"default"});
  const res=F.map(()=>({b:-1,sure:false})), used=new Set();
  for(const p of arr(r?.pairs)){ const f=(+p.front)-1, b=p.back==null?-1:(+p.back)-1;
    if(f>=0&&f<F.length&&b>=0&&b<B.length&&!used.has(b)&&res[f].b<0){ res[f]={b,sure:p.sure!==false}; used.add(b); } }
  return {pairs:res, order:String(r?.order||"")};
}
/* Looks at a scanned stack in order and decides which photo is the back of the card before it.
   Returns groups of photo indexes, e.g. [[0,1],[2],[3,4]]. */
async function matchSides(imgs, progress){
  const lim=await sample.limits(); const K=Math.max(2,Math.min(8,lim?.images?.maxCount||2));
  const thumbs=[]; for(const b of imgs) thumbs.push(await shrink(b,800));
  const groups=[]; let i=0;
  while(i<imgs.length){
    const end=Math.min(imgs.length,i+K), n=end-i;
    if(n===1){ groups.push([i]); break; }
    progress&&progress(`Matching fronts and backs… ${i+1}–${end} of ${imgs.length}`);
    let g=null;
    try{
      const r=await sample.json(
`These ${n} photos come from scanning a stack of business cards, in order. Each card's front was photographed first; some cards then have their back photographed right after it (a back can be blank, a logo, a map, a product list, or the same details in another language such as Chinese). Other cards have no back photo and the next photo is a different card's front.
Group the photos by physical card. A group is 1 photo (front only) or 2 consecutive photos (front then its back). Photos of a different company or person are a different card.
Reply with only JSON: {"groups":[[1,2],[3],[4,5]]} using photo numbers 1-${n}, covering every photo once, in order.`,
        {images:thumbs.slice(i,end), modelTier:"default"});
      g=Array.isArray(r?.groups)?r.groups:null;
      // validate: consecutive, in order, size 1–2, covers 1..n
      let next=1; for(const x of g||[]){ if(!Array.isArray(x)||x.length<1||x.length>2||x[0]!==next||(x.length===2&&x[1]!==next+1)){ g=null; break; } next+=x.length; }
      if(g&&next!==n+1) g=null;
    }catch(e){ if(e&&(e.code==="rate_limited"||e.code==="not_granted")) throw e; g=null; }
    if(!g){ for(let j=i;j<end;j++) groups.push([j]); i=end; continue; }
    // a lone photo at the end of a batch might be the front whose back is in the next batch, so look at it again
    let take=g; if(end<imgs.length && g.length>1 && g[g.length-1].length===1) take=g.slice(0,-1);
    for(const x of take) groups.push(x.map(k=>i+k-1));
    i+=take.reduce((s,x)=>s+x.length,0);
  }
  return groups;
}

    <div class="cmsg"><div id="cm-msg">Fill the frame with the card</div><div class="meter"><i id="cm-m"></i></div></div>
    <div class="cbar"><button class="btn" id="cm-skip" hidden>No back, save</button><button class="shot" id="cm-shot" aria-label="Take photo now"></button><button class="btn" id="cm-n" hidden>Done</button></div></div>`;
  const root=$("#viewerRoot"), v=root.querySelector("video"), frame=root.querySelector(".cframe"), msg=root.querySelector("#cm-msg"), meter=root.querySelector("#cm-m"), step=root.querySelector("#cm-step"), th=root.querySelector("#cm-th"), skip=root.querySelector("#cm-skip"), done=root.querySelector("#cm-n");
  v.srcObject=stream; try{ await v.play(); }catch(e){}
  let alive=true, timer=null, front=null, phase="front", saved=0;

  camStop=()=>{ alive=false; clearTimeout(timer); stream.getTracks().forEach(t=>t.stop()); };
  root.querySelector("#cm-x").onclick=closeViewer;
  const W=200, H=Math.round(W/1.75), cv=document.createElement("canvas"); cv.width=W; cv.height=H; const cx=cv.getContext("2d",{willReadFrequently:true});
  const NEED=8; // ~0.8 s of steady frames
  const say=(t,cls)=>{ msg.textContent=t; frame.className="cframe"+(cls?" "+cls:""); };
  const beep=()=>{ try{ navigator.vibrate&&navigator.vibrate(60); const A=window.AudioContext||window.webkitAudioContext; const ac=beep.ac||(beep.ac=new A()); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=1200; g.gain.value=.08; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+.07); }catch(e){} };
  const grab=async()=>{ const c=document.createElement("canvas"); const vw=v.videoWidth, vh=v.videoHeight; if(!vw) return null;
    // keep the framed area plus a margin, so the card fills the photo
    const fr=frame.getBoundingClientRect(), vr=v.getBoundingClientRect(); const sc=Math.max(vr.width/vw, vr.height/vh); const ox=(vr.width-vw*sc)/2, oy=(vr.height-vh*sc)/2;
    let x=(fr.left-vr.left-ox)/sc, y=(fr.top-vr.top-oy)/sc, w=fr.width/sc, h=fr.height/sc; const m=.18; x-=w*m; y-=h*m; w*=1+2*m; h*=1+2*m;
    x=Math.max(0,x); y=Math.max(0,y); w=Math.min(vw-x,w); h=Math.min(vh-y,h);
    c.width=Math.round(w); c.height=Math.round(h); c.getContext("2d").drawImage(v,x,y,w,h,0,0,c.width,c.height);
    const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",.9)); return b?await shrink(b,1800):null; };
  const take=async()=>{ if(busy) return; busy=true; const b=await grab(); if(!b||!alive){ busy=false; return; }
    beep(); const fl=root.querySelector(".flash"); fl.classList.add("on"); setTimeout(()=>fl.classList.remove("on"),60);
    const img=document.createElement("img"); img.alt=""; img.src=URL.createObjectURL(b); th.append(img);
    armed=false; steady=0; peak=0;
    if(phase==="front"){ front=b; phase="back"; step.textContent="Back of card"; skip.hidden=false; say("Flip the card over for the back"); }
    else { await commit(front,b); finish(); }
    busy=false; };
  const finish=async(noBack)=>{ if(noBack&&front) await commit(front,null); saved++; front=null; phase="front"; skip.hidden=true; done.hidden=false; th.innerHTML="";
    step.textContent=`Saved ${saved} · next card`; say("Saved. Hold up the next card"); armed=false; steady=0; };
  skip.onclick=()=>finish(true);
  done.onclick=closeViewer;
  root.querySelector("#cm-shot").onclick=()=>take();
  const tick=()=>{ if(!alive) return;
    if(v.videoWidth && !busy){
      // sample the framed area only
      const fr=frame.getBoundingClientRect(), vr=v.getBoundingClientRect(), vw=v.videoWidth, vh=v.videoHeight; const sc=Math.max(vr.width/vw, vr.height/vh); const ox=(vr.width-vw*sc)/2, oy=(vr.height-vh*sc)/2;
      cx.drawImage(v,(fr.left-vr.left-ox)/sc,(fr.top-vr.top-oy)/sc,fr.width/sc,fr.height/sc,0,0,W,H);
      const d=cx.getImageData(0,0,W,H).data, g=new Float32Array(W*H); let sum=0, hot=0;
      for(let i=0,j=0;i<g.length;i++,j+=4){ const y=d[j]*.299+d[j+1]*.587+d[j+2]*.114; g[i]=y; sum+=y; if(y>=252) hot++; }
      const bright=sum/g.length, glare=hot/g.length;
      let lap=0, edges=0; for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ const i=y*W+x; const l=Math.abs(4*g[i]-g[i-1]-g[i+1]-g[i-W]-g[i+W]); lap+=l; if(l>40) edges++; }
      const n=(W-2)*(H-2); lap/=n; const edgeFrac=edges/n;
      let diff=0; if(prev){ for(let i=0;i<g.length;i+=3) diff+=Math.abs(g[i]-prev[i]); diff/=g.length/3; } prev=g;
      const moving=diff>6;
      if(!armed && diff>14) armed=true; // the card was flipped or swapped
      peak=Math.max(peak*.97,lap);
      const hasCard=edgeFrac>.012;
      if(bright<45) { say("Too dark. Move toward the light","bad"); steady=0; }
      else if(glare>.3) { say("Too much glare. Tilt the card a little","bad"); steady=0; }
      else if(!hasCard) { say(phase==="front"?"Fill the frame with the card":"Flip the card over for the back"); steady=0; }
      else if(!armed) { say(phase==="back"?"Flip the card over for the back":"Hold up the next card"); steady=0; }
      else if(moving) { say("Hold steady…"); steady=0; }
      else if(lap<peak*.8 || lap<3) { say("Focusing…","bad"); steady=Math.max(0,steady-1); }
      else { steady++; say("Hold steady…","good"); if(steady>=NEED){ steady=0; take(); } }
      meter.style.width=Math.min(100,steady/NEED*100)+"%";
    }
    timer=setTimeout(tick,100); };
  // the first card can be taken right away; later ones wait for the view to change
  tick();
}
function scanUI(){
  scanBadge();
  const box=document.querySelector("#sc-list"); if(!box) return;
  const items=[...scanMem.values()].sort((a,b)=>b.createdAt-a.createdAt);
  box.innerHTML=items.length?items.map(it=>{ if(!it.url&&it.front) it.url=URL.createObjectURL(it.front); return `<div class="bkrow"><img src="${it.url||""}" alt=""><div><div class="ttl">${esc(it.name||"Card")}</div><div class="status ${it.cls||""}">${esc(it.msg||"")}</div>${it.supId?`<button class="linkbtn" data-open="${esc(it.supId)}">Open factory</button>`:""}${it.status==="stuck"?`<button class="linkbtn" data-retry="${esc(it.id)}">Try again</button> · <button class="linkbtn" data-drop="${esc(it.id)}">Remove</button>`:""}</div></div>`; }).join(""):`<div class="note">Cards you scan show up here.</div>`;
  box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openFactory(b.dataset.open));
  box.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{ const it=scanMem.get(b.dataset.retry); if(!it) return; it.status="wait"; it.tries=0; it.cls=""; it.msg="Queued"; scanUI(); processScans(); });
  box.querySelectorAll("[data-drop]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.drop; scanMem.delete(id); await scanDel(id); scanUI(); });
}
let scanAgain=false;
async function processScans(){
  if(scanBusy){ scanAgain=true; return; }
  if(!db||!assets||!sample||!imgOK) return;
  scanBusy=true;
  try{
    for(const it of [...scanMem.values()].sort((a,b)=>a.createdAt-b.createdAt)){
      if(it.status==="done"||it.status==="stuck") continue;
      if(!navigator.onLine){ it.msg="Offline. Will finish when you're back online."; scanUI(); break; }
      try{
        it.status="work"; it.cls=""; it.msg="Uploading photo…"; scanUI();
        if(!it.upF){ it.upF=(await assets.upload(it.front)).id; if(it.back) it.upB=(await assets.upload(it.back)).id; await scanPut(it); }
        it.msg="Reading card…"; scanUI();
        const r=await readCardSafe([it.front,it.back].filter(Boolean));
        const person=String(r?.contactName||"").trim();
        const cards=[{file:it.upF,label:"Card front",person,source:it.metAt?("Met at "+it.metAt):("Scanned "+today()),addedAt:Date.now()}];
        if(it.upB) cards.push({file:it.upB,label:"Card back",person,source:cards[0].source,addedAt:Date.now()});
        const extra=[it.metAt?`Met at ${it.metAt}${it.booth?` (booth ${it.booth})`:""} on ${today()}`:"",it.note].filter(Boolean).join(". ");
        const mt=findMatch(r);
        if(mt){
          const s0=mt.s, fp=fillPatch(s0,r);
          const patch={...fp.patch, cards:[...arr(s0.cards),...cards], updatedAt:Date.now(), lastContact:today()};
          if(extra) patch.notes=(((fp.patch.notes??s0.notes)||"")+((fp.patch.notes??s0.notes)?"\n":"")+extra).slice(0,4000);
          if(it.metAt&&!s0.metAt){ patch.metAt=it.metAt; if(it.booth) patch.booth=it.booth; }
          if(it.project&&!arr(s0.projects).includes(it.project)) patch.projects=[...arr(s0.projects),it.project];
          await db.doc("suppliers/"+s0.id).update(JSON.parse(JSON.stringify(patch)));
          S.sup.set(s0.id,{...s0,...patch});
          it.name=s0.company||s0.companyChinese||"Factory"; it.supId=s0.id; it.msg=`Already in your book (${mt.why}). Card added${fp.filled.length?`, plus ${fp.filled.join(", ")}`:""}.`; it.cls="ok";
        } else {
          const doc={}; F_FIELDS.forEach(([k])=>doc[k]=["phones","emails"].includes(k)?arr(r?.[k]).map(String):String(r?.[k]||""));
          if(!doc.company&&!doc.companyChinese) doc.company=person?`${person} (check card)`:`Unread card ${today()}`;
          doc.address=String(r?.address||""); doc.products=String(r?.products||""); doc.categories=arr(r?.categories).map(String);
          doc.projects=it.project?[it.project]:[]; doc.metAt=it.metAt||""; doc.booth=it.booth||""; doc.notes=extra;
          doc.cardFront=it.upF; doc.cardBack=it.upB||""; doc.source="card-scan"; doc.lastContact=today();
          doc.createdAt=doc.updatedAt=Date.now(); if(me) doc.addedBy=me;
          const ref=db.collection("suppliers").doc(); await ref.set(JSON.parse(JSON.stringify(doc))); S.sup.set(ref.id,{id:ref.id,...doc});
          it.name=doc.company||doc.companyChinese; it.supId=ref.id; it.msg=person?`New factory saved · ${person}`:"New factory saved"; it.cls="ok";
          if(it.research&&canResearch()){ it.msg+=" · researching…"; scanUI(); try{ await runResearch(ref.id); it.msg=it.msg.replace(" · researching…"," · researched"); }catch(e){} }
        }
        it.status="done"; await scanDel(it.id); scanUI(); render();
        if(!document.querySelector("#sc-list")) toast(`${it.name}: ${it.cls==="ok"?"saved":"done"}`);
      }catch(e){
        it.status="wait"; it.cls="err";
        const code=e?.code||"", why=({image_rejected:"the photo couldn't be read",refused:"Claude declined this photo",invalid_json:"Claude couldn't make out the card",empty_completion:"Claude couldn't make out the card",upstream_error:"connection hiccup",session_expired:"you need to sign in again",prompt_too_large:"the photo is too large"})[code]||(e?.message?String(e.message).slice(0,80):"unknown error");
        if(code==="rate_limited"){ it.msg="Busy. Will retry in a minute."; scanUI(); setTimeout(processScans,60000); break; }
        if(code==="not_granted"||code==="sampling_disabled"){ it.msg="Claude wasn't allowed to read cards. Allow it and reopen."; scanUI(); break; }
        if(!navigator.onLine){ it.msg="Offline. Will finish when you're back online."; scanUI(); break; }
        it.tries=(it.tries||0)+1;
        if(it.tries>=3||code==="refused"||code==="image_rejected"){ it.status="stuck"; it.msg=`Couldn't read this card (${why}). Tap Try again, or Remove and add it by hand.`; await scanPut(it); }
        else { it.msg=`Couldn't finish (${why}). Trying again shortly…`; setTimeout(processScans,20000); }
        scanUI();
        continue; // one bad card no longer holds up the rest
      }
    }
  } finally { scanBusy=false; scanBadge(); if(scanAgain){ scanAgain=false; setTimeout(processScans,0); } }
}

/* ---------- save contact to phone (QR) and export contacts ---------- */
const QRLIB="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
let qrP=null; function getQr(){ if(!qrP) qrP=loadScript(QRLIB).then(()=>window.qrcode).catch(e=>{ qrP=null; throw e; }); return qrP; }
function vcardFor(s){
  const e=v=>String(v||"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/([,;])/g,"\\$1");
  const name=String(s.contactName||"").trim(); const parts=name.split(/\s+/).filter(Boolean);
  const L=["BEGIN:VCARD","VERSION:3.0",`N:${e(parts.length>1?parts.slice(-1)[0]:"")};${e(parts.length>1?parts.slice(0,-1).join(" "):(parts[0]||s.company||""))};;;`,`FN:${e(name||s.company||s.companyChinese||"Factory")}`];
  if(s.company||s.companyChinese) L.push(`ORG:${e([s.company,s.companyChinese].filter(Boolean).join(" / "))}`);
  if(s.title) L.push(`TITLE:${e(s.title)}`);
  arr(s.phones).forEach(p=>L.push(`TEL;TYPE=CELL:${String(p).replace(/[^\d+]/g,"")}`));
  if(s.whatsapp) L.push(`TEL;TYPE=CELL:${String(s.whatsapp).replace(/[^\d+]/g,"")}`);
  arr(s.emails).forEach(m=>L.push(`EMAIL;TYPE=WORK:${e(m)}`));
  if(s.website) L.push(`URL:${e(/^https?:/i.test(s.website)?s.website:"https://"+s.website)}`);
  if(s.address||s.city) L.push(`ADR;TYPE=WORK:;;${e(s.address)};${e(s.city)};${e(s.province)};;${e(s.country)}`);
  const note=[s.wechat?`WeChat: ${s.wechat}`:"",s.products?`Makes: ${s.products}`:"",s.metAt?`Met at: ${s.metAt}`:"",arr(s.categories).length?`Categories: ${arr(s.categories).join(", ")}`:""].filter(Boolean).join("\n");
  if(note) L.push(`NOTE:${e(note)}`);
  L.push("END:VCARD"); return L.join("\r\n");
}
async function openContactQR(id){
  const s=S.sup.get(id); if(!s) return;
  const vc=vcardFor(s);
  $("#viewerRoot").innerHTML=`<div class="viewer" role="dialog" aria-modal="true" aria-label="Save contact"><div class="vhead"><div class="vtitle">Save ${esc(s.contactName||s.company||"contact")} to your phone</div><button class="x" id="vx" aria-label="Close">✕</button></div>
    <div class="vbody" style="justify-content:center;gap:14px;padding:20px;text-align:center"><div id="qrbox" style="background:#fff;padding:14px;border-radius:12px;box-shadow:var(--shadow)">Making QR code…</div>
    <div style="max-width:420px">Point your phone's camera at this code, then tap <strong>Add to contacts</strong>. It includes the name, company, phones, email, website and address, plus WeChat and what they make in the notes.</div>
    <button class="btn sm ghost" id="qr-copy">Copy contact details instead</button></div></div>`;
  $("#vx").onclick=closeViewer;
  $("#qr-copy").onclick=async()=>{ const t=[s.contactName,s.title,s.company,s.companyChinese,...arr(s.phones),...arr(s.emails),s.wechat?("WeChat: "+s.wechat):"",s.website,s.address].filter(Boolean).join("\n"); try{ await navigator.clipboard.writeText(t); toast("Copied"); }catch(e){ toast("Select the text to copy it"); } };
  try{
    const q=await getQr(); q.stringToBytes=q.stringToBytesFuncs["UTF-8"];
    const qr=q(0,"L"); qr.addData(vc,"Byte"); qr.make();
    const n=qr.getModuleCount(), cell=Math.max(3,Math.floor(Math.min(320,window.innerWidth-80)/n));
    $("#qrbox").innerHTML=qr.createSvgTag({cellSize:cell,margin:2,scalable:false});
  }catch(e){ $("#qrbox").textContent="Couldn't make the QR code here. Use Copy contact details instead."; }
}
async function exportContacts(){
  if(!downloads){ toast("Export isn't available in this view"); return; }
  const list=[...S.sup.values()].filter(matches);
  const rows=[["Name","Given Name","Family Name","Organization 1 - Name","Organization 1 - Title","E-mail 1 - Value","E-mail 2 - Value","Phone 1 - Value","Phone 2 - Value","Website 1 - Value","Address 1 - Formatted","Notes","Labels"]];
  for(const s of list){ const nm=String(s.contactName||"").trim(), p=nm.split(/\s+/);
    rows.push([nm||s.company||s.companyChinese||"",p.length>1?p.slice(0,-1).join(" "):nm,p.length>1?p.slice(-1)[0]:"",[s.company,s.companyChinese].filter(Boolean).join(" / "),s.title||"",arr(s.emails)[0]||"",arr(s.emails)[1]||"",arr(s.phones)[0]||s.whatsapp||"",arr(s.phones)[1]||"",s.website||"",[s.address,s.city,s.province,s.country].filter(Boolean).join(", "),[s.wechat?`WeChat: ${s.wechat}`:"",s.products?`Makes: ${s.products}`:"",s.metAt?`Met at: ${s.metAt}`:""].filter(Boolean).join(" | "),"Source Book"]); }
  try{ await downloads.save({filename:`source-book-contacts-${today()}.csv`, data:"\uFEFF"+csv(rows)}); toast(`${list.length} contacts exported. Import the file in Google Contacts or Outlook.`); }catch(e){ if(e?.code && e.code!=="declined") toast("Export didn't finish"); }
}
document.addEventListener("error",e=>{ const t=e.target; if(t&&t.tagName==="IMG"&&(t.classList.contains("pimg")||t.classList.contains("ti")||t.classList.contains("thumb"))){ const d=document.createElement("div"); d.className=t.className.replace("pimg","ph")+" ph"; d.title="Picture couldn't load"; (t.closest("a.plink")||t).replaceWith(d); } },true);
/* ---------- boot ---------- */
render();
(async()=>{
  const c=window.claude;
  if(!c?.use){ $("#list").innerHTML=`<div class="empty"><strong>Open this in Claude</strong><span>Source Book saves your contacts through your Claude account.</span></div>`; $("#count").textContent=""; return; }
  const [d,a,sm,dl,u,m]=await Promise.all(["db","assets","sample","downloads","user","mcp"].map(n=>c.use(n).catch(()=>null)));
  db=d; assets=a; sample=sm; downloads=dl; mcp=m; userNS=u;
  if(u){ try{ me=await u.id(); }catch{ me=null; } }

  if(downloads){ const b=document.createElement("button"); b.className="btn sm ghost"; b.textContent="Export CSV"; b.onclick=exportCsv; $(".brand").append(b);
    const c=document.createElement("button"); c.className="btn sm ghost"; c.textContent="Export contacts"; c.onclick=exportContacts; $(".brand").append(c); }
  db.collection("suppliers").onSnapshot(snap=>{ S.sup=new Map(snap.docs.map(x=>[x.id,{id:x.id,...x.data()}])); S.loaded.s=true; render(); },
    e=>{ $("#list").innerHTML=`<div class="empty"><strong>Couldn't load factories</strong><span>Reload the page to try again.</span></div>`; });
  db.collection("quotes").onSnapshot(snap=>{ S.quotes=snap.docs.map(x=>({id:x.id,...x.data()})); S.loaded.q=true; render(); }, ()=>{});
  db.collection("rfqs").onSnapshot(snap=>{ S.rfqs=snap.docs.map(x=>({id:x.id,...x.data()})); }, ()=>{});
  db.collection("samples").onSnapshot(snap=>{ S.samples=snap.docs.map(x=>({id:x.id,...x.data()})); render(); }, ()=>{});
  db.collection("storefinds").onSnapshot(snap=>{ S.finds=snap.docs.map(x=>({id:x.id,...x.data()})); const h=document.getElementById("simhist"); if(h) h.innerHTML=findHistHtml(); }, ()=>{});
  db.collection("docs").onSnapshot(snap=>{ S.docs=snap.docs.map(x=>({id:x.id,...x.data()})); render(); if(detailId) refreshDocs(detailId); }, ()=>{});
  db.doc("settings/defaults").onSnapshot(snap=>{ S.settings={...SET_DEFAULT,...(snap.exists?snap.data():{})}; render(); }, ()=>{});
  db.collection("ptypes").onSnapshot(snap=>{ const m=new Map(), ids=new Set(); snap.docs.forEach(d=>{ ids.add(d.id); const mp=d.data()?.map||{}; for(const k in mp) if(mp[k]&&mp[k].t) m.set(k,mp[k]); }); S.ptypes=m; S.ptypeDocs=ids; render(); }, ()=>{});
  db.collection("inbox").onSnapshot(snap=>{ S.inbox=snap.docs.map(x=>({id:x.id,...x.data()})); dropBadge(); const l=document.getElementById("db-list"); if(l) l.innerHTML=dropList(); }, ()=>{});
  db.doc("settings/duties").onSnapshot(snap=>{ S.dutiesExists=!!snap.exists; S.duties=(snap.exists&&snap.data()?.map)||{}; render(); }, ()=>{});
  db.doc("settings/targets").onSnapshot(snap=>{ S.targetsExists=!!snap.exists; S.targets=(snap.exists&&snap.data()?.map)||{}; render(); }, ()=>{});
  if(canWrite){
    if(sample&&imgOK){ const b=document.createElement("button"); b.className="btn sm ghost"; b.textContent="Scan a stack"; b.onclick=openBulk; $(".brand").append(b); }
    if(sample){ const w=document.createElement("button"); w.className="btn sm ghost"; w.textContent="✎ Writing helper"; w.onclick=()=>openMessage(null); $(".brand").append(w); }
    const g=document.createElement("button"); g.className="btn sm ghost"; g.textContent="Settings"; g.onclick=openSettings; $(".brand").append(g);
    if(sample){ const fs=document.createElement("button"); fs.className="btn sm"; fs.id="findsim"; fs.textContent="📷 Find similar"; fs.onclick=openFindSimilar; $(".brand").append(fs); }
    else if(assets&&db){ const fs=document.createElement("button"); fs.className="btn sm"; fs.id="findsim"; fs.textContent="📷 Find similar"; fs.onclick=()=>{ window.__dbPreset="find"; openDropBox(); }; $(".brand").append(fs); }
    if(sample&&assets&&db){ const dbx=document.createElement("button"); dbx.className="btn sm ghost"; dbx.id="dropbtn"; dbx.textContent="Send a file (read hourly)"; dbx.onclick=()=>openDropBox(); $(".brand").append(dbx); }
    const hb=document.createElement("button"); hb.className="btn sm ghost"; hb.textContent="＋ Add by hand"; hb.onclick=()=>openFactoryForm(); $(".brand").append(hb);
    scanResume();
  }
})();
})();
